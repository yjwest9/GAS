<style>
  /* ===== Pretendard (토스 계열 한글 폰트) ===== */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

  :root {
    --bg: #f2f4f6;
    --surface: #ffffff;
    --line: #e5e8eb;
    --text: #191f28;
    --text2: #4e5968;
    --text3: #8b95a1;
    --blue: #3182f6;
    --blue-dark: #1b64da;
    --up: #f04452; /* 상승=빨강 (국내 관례) */
    --down: #3182f6; /* 하락=파랑 */
    --radius: 18px;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 6px 18px rgba(0, 0, 0, 0.04);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family:
      "Pretendard",
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  /* ===== 화면 전환 ===== */
  .screen {
    display: none;
    animation: fade 0.3s ease;
  }
  .screen.active {
    display: block;
  }
  @keyframes fade {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  /* ===== 카드 ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  /* ===== 브랜드 ===== */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 4px 22px;
  }
  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    display: grid;
    place-items: center;
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
  }
  .brand-sub {
    font-size: 13px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* ===== 입력 ===== */
  .field-label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 10px;
  }
  .field-label .muted {
    font-weight: 500;
    color: var(--text3);
    font-size: 12px;
  }
  .muted {
    color: var(--text3);
    font-weight: 500;
  }
  .text-input {
    width: 100%;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 13px;
    font-size: 16px;
    background: #fbfcfd;
    color: var(--text);
    margin-bottom: 18px;
    font-family: inherit;
  }
  .text-input:last-child {
    margin-bottom: 0;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--blue);
    background: #fff;
  }
  .text-input::placeholder {
    color: var(--text3);
  }

  /* ===== 세그먼트 / 칩 ===== */
  .seg {
    display: flex;
    gap: 8px;
  }
  .seg-btn {
    flex: 1;
    padding: 13px 0;
    border: 1px solid var(--line);
    background: #fbfcfd;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }
  .seg-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    padding: 10px 16px;
    border: 1px solid var(--line);
    background: #fbfcfd;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text2);
    cursor: pointer;
  }
  .chip.active {
    background: #e8f1fe;
    border-color: var(--blue);
    color: var(--blue-dark);
  }

  /* ===== 면책 ===== */
  .disclaimer {
    font-size: 12.5px;
    color: var(--text3);
    line-height: 1.6;
    background: #fff7e6;
    border: 1px solid #ffe1a8;
    border-radius: 13px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  /* ===== 버튼 ===== */
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary:active {
    background: var(--blue-dark);
  }
  .btn-block {
    width: 100%;
  }

  /* ===== 게임 상단 ===== */
  .game-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 4px 16px;
  }
  .ticker {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ticker-label {
    font-size: 20px;
    font-weight: 800;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--blue-dark);
    background: #e8f1fe;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .timer {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .timer.urgent {
    color: var(--up);
  }

  /* ===== 게임 그리드 (모바일=1열) ===== */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .col-main .price-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .price-now {
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .price-change {
    font-size: 15px;
    font-weight: 700;
    margin-top: 4px;
  }
  .lev-tag {
    background: #fff0f0;
    color: var(--up);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .chart-wrap {
    height: 200px;
    margin-top: 14px;
  }

  .stat-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text3);
  }
  .stat-return {
    font-size: 34px;
    font-weight: 800;
    margin: 8px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .stat-sub {
    font-size: 15px;
    color: var(--text2);
    font-weight: 600;
  }
  .pos-state {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text3);
    background: #f7f8fa;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }

  .rank-list {
    list-style: none;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 12px;
    background: #f7f8fa;
  }
  .rank-row.me {
    background: #e8f1fe;
  }
  .rank-no {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: var(--text3);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    display: grid;
    place-items: center;
  }
  .rank-row:nth-child(1) .rank-no {
    background: #ffb020;
  }
  .rank-row:nth-child(2) .rank-no {
    background: #9aa4af;
  }
  .rank-row:nth-child(3) .rank-no {
    background: #cd7f32;
  }
  .rank-name {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
  }
  .rank-val {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .rank-list.reveal .rank-val {
    display: block;
  }

  /* ===== 하단 액션바 ===== */
  .action-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: flex;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    max-width: 1280px;
    margin: 0 auto;
  }
  .btn-buy,
  .btn-sell,
  .btn-ghost {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-buy {
    background: var(--up);
    color: #fff;
  }
  .btn-sell {
    background: var(--down);
    color: #fff;
  }
  .btn-ghost {
    flex: 0.7;
    background: #f2f4f6;
    color: var(--text2);
  }
  .btn-buy:disabled,
  .btn-sell:disabled,
  .btn-ghost:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== 색상 헬퍼 ===== */
  .up {
    color: var(--up) !important;
  }
  .down {
    color: var(--down) !important;
  }

  /* ===== 결과 ===== */
  .result-hero {
    text-align: center;
    padding: 36px 0 8px;
  }
  .result-rank {
    font-size: 18px;
    font-weight: 700;
    color: var(--blue-dark);
    background: #e8f1fe;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
  }
  .result-return {
    font-size: 48px;
    font-weight: 800;
    margin: 18px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .result-sub {
    font-size: 16px;
    color: var(--text2);
    font-weight: 600;
  }
  .email-note {
    text-align: center;
    font-size: 13px;
    color: var(--text3);
    margin: 6px 0 16px;
  }

  /* ===== 태블릿 (769~1024) : 2열 ===== */
  @media (min-width: 769px) {
    .grid {
      grid-template-columns: 1.6fr 1fr;
    }
    .col-main {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
    }
    .col-side {
      grid-column: 2;
    }
    .col-rank {
      grid-column: 2;
    }
    .chart-wrap {
      height: 260px;
    }
  }
  /* ===== PC (1025+) : 3열 풀 대시보드 ===== */
  @media (min-width: 1025px) {
    .grid {
      grid-template-columns: 2fr 1fr 1fr;
    }
    .col-main {
      grid-column: 1;
      grid-row: auto;
    }
    .col-side {
      grid-column: 2;
    }
    .col-rank {
      grid-column: 3;
    }
    .chart-wrap {
      height: 300px;
    }
    .action-bar {
      position: static;
      background: none;
      border: none;
      backdrop-filter: none;
      padding: 18px 0 0;
      max-width: none;
    }
    .app {
      padding-bottom: 40px;
    }
  }
</style>
