<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

  :root {
    --bg: #f2f4f6;
    --surface: #ffffff;
    --line: #e5e8eb;
    --text: #191f28;
    --text2: #4e5968;
    --text3: #8b95a1;
    --blue: #3182f6;
    --blue-dark: #1b64da;
    --up: #f04452;
    --down: #3182f6;
    --ai: #7c5cff;
    --radius: 18px;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 6px 18px rgba(0, 0, 0, 0.04);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html,
  body {
    overflow-x: hidden;
    background: var(--bg);
  }
  body {
    font-family:
      "Pretendard",
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .app {
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px 120px;
    position: relative;
  }

  .screen {
    display: none;
    animation: fade 0.3s ease;
  }
  .screen.active {
    display: block;
  }
  @keyframes fade {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  /* 브랜드 */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 4px 22px;
  }
  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    display: grid;
    place-items: center;
    flex: none;
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
  }
  .brand-sub {
    font-size: 13px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* 입력 */
  .field-label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 10px;
  }
  .field-label .muted {
    font-weight: 500;
    color: var(--text3);
    font-size: 12px;
  }
  .muted {
    color: var(--text3);
    font-weight: 500;
  }
  .text-input {
    width: 100%;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 13px;
    font-size: 16px;
    background: #fbfcfd;
    color: var(--text);
    margin-bottom: 18px;
    font-family: inherit;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--blue);
    background: #fff;
  }
  .text-input.invalid {
    border-color: var(--up);
    background: #fff5f5;
  }
  .text-input::placeholder {
    color: var(--text3);
  }
  .err {
    color: var(--up);
    font-size: 12.5px;
    font-weight: 600;
    margin: -12px 0 14px;
    min-height: 0;
  }
  .market-hint {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text3);
    line-height: 1.5;
  }
  .room-code {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 6px;
    text-align: center;
    background: #f2f4f6;
    border-radius: 14px;
    padding: 16px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  input.code-input {
    width: 100%;
    box-sizing: border-box;
    border: 2px solid var(--line);
    outline: none;
    text-transform: uppercase;
    font-family: inherit;
    font-size: 24px;
    letter-spacing: 5px;
    padding: 18px;
    caret-color: var(--blue);
  }
  input.code-input:focus {
    border-color: var(--blue);
    background: #fff;
  }
  input.code-input::placeholder {
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--text3);
    font-weight: 600;
    text-transform: none;
  }
  .mode-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 6px;
    margin-right: 6px;
    background: #e8eaed;
    color: var(--text2);
    vertical-align: middle;
  }
  .mode-badge.multi {
    background: #e7f0ff;
    color: var(--blue);
  }
  .lobby-hero {
    text-align: center;
    padding: 8px 0 4px;
    margin-bottom: 14px;
  }
  .lobby-label {
    font-size: 13px;
    color: var(--text3);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .lobby-info {
    font-size: 13.5px;
    color: var(--text2);
    line-height: 1.6;
    text-align: center;
  }
  .invite-link {
    font-size: 11px;
    color: var(--text3);
    word-break: break-all;
    text-align: center;
    margin-top: 10px;
    line-height: 1.4;
  }

  /* 세그/칩 */
  .seg {
    display: flex;
    gap: 8px;
  }
  .seg-btn {
    flex: 1;
    min-width: 0;
    padding: 13px 0;
    border: 1px solid var(--line);
    background: #fbfcfd;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }
  .seg-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }

  /* 면책/버튼 */
  .disclaimer {
    font-size: 12.5px;
    color: var(--text3);
    line-height: 1.6;
    background: #fff7e6;
    border: 1px solid #ffe1a8;
    border-radius: 13px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary:active {
    background: var(--blue-dark);
  }
  .btn-block {
    width: 100%;
  }
  .btn-copy {
    width: 100%;
    background: #f2f4f6;
    color: var(--text2);
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .btn-copy.done {
    background: #e8f1fe;
    color: var(--blue-dark);
  }

  /* 게임 상단 */
  .game-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 4px 14px;
    gap: 10px;
  }
  .ticker {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .ticker-label {
    font-size: 19px;
    font-weight: 800;
    white-space: nowrap;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--blue-dark);
    background: #e8f1fe;
    padding: 3px 8px;
    border-radius: 6px;
    flex: none;
  }
  .timer {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .timer.urgent {
    color: var(--up);
  }

  /* 시황 브리핑 배너 */
  .brief {
    background: #eef3ff;
    border: 1px solid #d6e4ff;
    color: var(--blue-dark);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  /* 내 자산 카드 */
  .stat-card .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .stat-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text3);
  }
  .stat-return {
    font-size: 32px;
    font-weight: 800;
    margin: 6px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .stat-sub {
    font-size: 15px;
    color: var(--text2);
    font-weight: 600;
  }
  .lev-tag {
    background: #fff0f0;
    color: var(--up);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    flex: none;
  }
  .pos-state {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text3);
    background: #f7f8fa;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }

  /* 워치리스트 */
  .watchlist {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .watch-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 12px 13px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .watch-item.held {
    border-color: var(--blue);
    background: #f3f8ff;
  }
  .watch-item.featured {
    outline: 2px solid var(--blue);
    outline-offset: -2px;
  }
  .watch-name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .watch-chg {
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .watch-held-dot {
    font-size: 10px;
    color: var(--blue);
    font-weight: 700;
  }

  /* 차트 2개 */
  .charts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .chart-card {
    padding: 16px;
    min-width: 0;
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .chart-name {
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chart-price {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .chart-wrap {
    height: 150px;
    margin: 10px 0 12px;
    min-width: 0;
    overflow: hidden;
  }
  .btn-buy.sm {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 12px;
  }

  /* 랭킹 */
  .rank-list {
    list-style: none;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 12px;
    background: #f7f8fa;
  }
  .rank-row.me {
    background: #e8f1fe;
  }
  .rank-no {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: var(--text3);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    display: grid;
    place-items: center;
    flex: none;
  }
  .rank-row:nth-child(1) .rank-no {
    background: #ffb020;
  }
  .rank-row:nth-child(2) .rank-no {
    background: #9aa4af;
  }
  .rank-row:nth-child(3) .rank-no {
    background: #cd7f32;
  }
  .rank-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rank-val {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex: none;
  }

  /* 액션바 */
  .action-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: flex;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    max-width: 1280px;
    margin: 0 auto;
  }
  .btn-buy,
  .btn-sell,
  .btn-ghost {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition:
      transform 0.06s ease,
      box-shadow 0.15s ease,
      opacity 0.15s;
  }
  .btn-buy {
    background: var(--up);
    color: #fff;
  }
  .btn-sell {
    flex: 1.4;
    background: var(--blue);
    color: #fff;
    font-weight: 800;
    box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3);
  }
  .btn-ghost {
    flex: 0.8;
    background: #f2f4f6;
    color: var(--text2);
    font-size: 14px;
  }
  .btn-buy:active,
  .btn-sell:active,
  .btn-ghost:active {
    transform: translateY(1px);
  }
  .btn-sell:disabled {
    box-shadow: none;
  }
  .btn-buy:disabled,
  .btn-sell:disabled,
  .btn-ghost:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .mute-btn {
    border: none;
    background: #f2f4f6;
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 17px;
    cursor: pointer;
    line-height: 1;
  }

  .up {
    color: var(--up) !important;
  }
  .down {
    color: var(--down) !important;
  }

  /* 결과 */
  .result-hero {
    text-align: center;
    padding: 30px 0 6px;
  }
  .result-rank {
    font-size: 18px;
    font-weight: 700;
    color: var(--blue-dark);
    background: #e8f1fe;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
  }
  .result-return {
    font-size: 46px;
    font-weight: 800;
    margin: 16px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .result-sub {
    font-size: 16px;
    color: var(--text2);
    font-weight: 600;
  }

  /* === AI 분석 강조 카드 (우리 웹의 강점) === */
  .ai-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #eef4ff 0%, #f3eeff 100%);
    border: 1px solid #dde4ff;
    border-radius: var(--radius);
    padding: 20px 20px 20px 22px;
    margin-bottom: 14px;
    box-shadow:
      0 2px 8px rgba(124, 92, 255, 0.08),
      0 10px 24px rgba(49, 130, 246, 0.06);
  }
  .ai-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: linear-gradient(180deg, var(--blue), var(--ai));
  }
  .ai-card-head {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14.5px;
    font-weight: 800;
    color: var(--blue-dark);
    margin-bottom: 12px;
  }
  .ai-badge {
    display: inline-grid;
    place-items: center;
    background: linear-gradient(135deg, var(--blue), var(--ai));
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 8px;
    letter-spacing: 0.6px;
    box-shadow: 0 2px 6px rgba(124, 92, 255, 0.3);
  }
  .ai-feedback {
    font-size: 15.5px;
    line-height: 1.75;
    color: var(--text);
    font-weight: 500;
  }
  .ai-feedback.loading {
    color: var(--text3);
    position: relative;
  }
  .ai-feedback.loading::after {
    content: "";
    display: inline-block;
    width: 1.4em;
    text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% {
      content: "";
    }
    25% {
      content: ".";
    }
    50% {
      content: "..";
    }
    75% {
      content: "...";
    }
  }

  /* === 수익률 추이 차트 (상세) === */
  .detail-chart-wrap {
    height: 180px;
    margin-top: 12px;
    min-width: 0;
    overflow: hidden;
  }

  /* === 거래 타임라인 (상세) === */
  .trade-timeline {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .tl-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 12px;
    background: #f7f8fa;
  }
  .tl-time {
    font-size: 12px;
    color: var(--text3);
    font-variant-numeric: tabular-nums;
    flex: none;
    width: 40px;
  }
  .tl-type {
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 8px;
    flex: none;
    min-width: 54px;
    text-align: center;
  }
  .tl-buy {
    background: #fff0f1;
    color: var(--up);
  }
  .tl-sell {
    background: #e8f1fe;
    color: var(--blue-dark);
  }
  .tl-lev {
    background: #fff5e0;
    color: #b8860b;
  }
  .tl-liq {
    background: #191f28;
    color: #fff;
  }
  .tl-main {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tl-pnl {
    font-size: 13px;
    font-weight: 800;
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  .tl-empty {
    text-align: center;
    color: var(--text3);
    padding: 22px 0;
    font-size: 13.5px;
  }
  .detail-pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12.5px;
    color: var(--text2);
    line-height: 1.65;
    margin-top: 10px;
    font-family: "Pretendard", sans-serif;
  }

  .email-note {
    text-align: center;
    font-size: 13px;
    color: var(--text3);
    margin: 6px 0 16px;
  }

  /* 오버레이 */
  .news-toast {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-90px);
    z-index: 40;
    background: #191f28;
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transition: 0.3s;
    max-width: 88%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .news-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .liq-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    place-items: center;
    align-content: center;
    justify-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    text-align: center;
  }
  .liq-overlay.show {
    display: grid;
    animation: fade 0.2s ease;
  }
  .liq-skull {
    font-size: 74px;
  }
  .liq-text {
    font-size: 22px;
    font-weight: 800;
  }
  .countdown {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    place-items: center;
    background: rgba(255, 255, 255, 0.96);
  }
  .countdown.show {
    display: grid;
  }
  .countdown-num {
    font-size: 96px;
    font-weight: 800;
    color: var(--blue);
    animation: cdpop 0.7s ease;
  }
  .countdown-num.start {
    font-size: 60px;
    color: var(--up);
  }
  @keyframes cdpop {
    0% {
      transform: scale(0.4);
      opacity: 0;
    }
    40% {
      transform: scale(1);
      opacity: 1;
    }
    100% {
      transform: scale(1.4);
      opacity: 0;
    }
  }
  .app.shake {
    animation: shake 0.5s;
  }
  @keyframes shake {
    10%,
    90% {
      transform: translateX(-2px);
    }
    20%,
    80% {
      transform: translateX(4px);
    }
    30%,
    50%,
    70% {
      transform: translateX(-8px);
    }
    40%,
    60% {
      transform: translateX(8px);
    }
  }
  .chart-price.flash {
    animation: pulse 0.35s ease;
  }
  @keyframes pulse {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.08);
    }
    100% {
