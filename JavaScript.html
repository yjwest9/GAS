<script>
  /* ===================================================================
   * StockBattle 엔진
   *  · 종목 인게임 선택(한 종목만 보유, 올인) · 워치리스트 + 차트 2개
   *  · 시드 기반 결정론 시뮬(멀티 대비) · 종목별 뉴스 아크(급등→되돌림)
   *  · 거래 로그/수익률 추이 기록(상세화면 시각화·AI 피드백용)
   *  · 멀티: 시드 공유 + 포지션 상태 공유 / 게임 단위 기록 그룹화
   * =================================================================== */

  const START_MONEY = 1000000;
  const FEE_RATE = 0.001; // 매수·매도 양방향 0.1% 수수료
  const TICK_MS = 1500;
  const VOL = 0.012;
  const LEV_STEPS = [1, 2, 5, 10, 20];
  const COOLDOWN_TICKS = Math.round(25000 / TICK_MS);
  const EVENT_TICKS = 12;
  const EVENT_DRIFT = 0.022;
  const COUNTDOWN_MS = 2800;
  function nowSync() {
    return Date.now() + ((typeof S !== "undefined" && S && S.clockOffset) || 0);
  }

  // ---------- 통화 표기 (해외주=$, 국내주·코인=원) ----------
  // 가격 거짓 섞지 않도록: 게임 중엔 S.category로 통화를 정해 로그에 같이 저장하고,
  // 표시할 땐 그 단위를 그대로 사용. 옛 기록(unit 없음)은 기호 없이 숫자만.
  function curOf(cat) {
    return cat === "us" ? "usd" : "krw";
  } // coin 시드는 KRW
  function fmtMoney(n, unit) {
    var v = fmtNum(n);
    if (unit === "usd") return "$" + v;
    if (unit === "krw") return v + "원";
    return v; // 단위 모름(옛 기록) → 숫자만
  }

  // ---------- 사운드 (Web Audio, 파일 없이 합성음) ----------
  // iOS Safari는 AudioContext를 반드시 "사용자 제스처(탭) 핸들러 안"에서 생성/resume해야 unlock됨.
  // 그래서 게임 시작·입장·매수 등 첫 탭 시점에 unlockAudio()를 호출해 미리 깨워둔다.
  let AC = null,
    SFX_ON = true;
  function unlockAudio() {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      // 무음 버퍼를 한 번 흘려보내 iOS 오디오 파이프라인을 확실히 연다
      const b = AC.createBuffer(1, 1, 22050),
        s = AC.createBufferSource();
      s.buffer = b;
      s.connect(AC.destination);
      s.start(0);
    } catch (e) {}
  }
  // 어떤 탭이든 첫 제스처에서 오디오 unlock (1회). iOS 무음 문제의 핵심 대응.
  ["touchend", "click", "pointerdown"].forEach(function (ev) {
    document.addEventListener(
      ev,
      function once() {
        unlockAudio();
      },
      { passive: true },
    );
  });
  function sfx(type) {
    if (!SFX_ON) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const t0 = AC.currentTime;
      const beep = (freq, start, dur, wave, gain) => {
        const o = AC.createOscillator(),
          g = AC.createGain();
        o.type = wave || "triangle";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + start);
        g.gain.exponentialRampToValueAtTime(gain || 0.12, t0 + start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        o.connect(g);
        g.connect(AC.destination);
        o.start(t0 + start);
        o.stop(t0 + start + dur + 0.03);
      };
      if (type === "buy") {
        beep(523, 0, 0.12);
        beep(784, 0.07, 0.13);
      } else if (type === "sell") {
        beep(659, 0, 0.11);
        beep(440, 0.08, 0.15);
      } else if (type === "lev") {
        beep(880, 0, 0.07, "square", 0.07);
        beep(1175, 0.07, 0.1, "square", 0.07);
      } else if (type === "news") {
        beep(988, 0, 0.16, "sine", 0.09);
      } else if (type === "liq") {
        beep(180, 0, 0.45, "sawtooth", 0.16);
        beep(110, 0.13, 0.5, "sawtooth", 0.16);
      } else if (type === "count") {
        beep(660, 0, 0.09, "sine", 0.1);
      } else if (type === "go") {
        beep(523, 0, 0.1);
        beep(659, 0.1, 0.1);
        beep(1047, 0.2, 0.26);
      } else if (type === "win") {
        beep(523, 0, 0.12);
        beep(659, 0.12, 0.12);
        beep(784, 0.24, 0.12);
        beep(1047, 0.36, 0.3);
      }
    } catch (e) {}
  }
  document.getElementById("g-mute").onclick = function () {
    SFX_ON = !SFX_ON;
    this.textContent = SFX_ON ? "🔊" : "🔇";
    if (SFX_ON) sfx("count");
  };

  const INSTR = {
    kr: [
      ["000660.KS", "SK하이닉스"],
      ["005930.KS", "삼성전자"],
      ["035720.KS", "카카오"],
      ["035420.KS", "네이버"],
    ],
    us: [
      ["AAPL", "애플"],
      ["TSLA", "테슬라"],
      ["NVDA", "엔비디아"],
      ["MSFT", "마이크로소프트"],
    ],
    coin: [
      ["bitcoin", "비트코인"],
      ["ethereum", "이더리움"],
      ["solana", "솔라나"],
      ["ripple", "리플"],
    ],
  };
  const CAT_LABEL = { kr: "국내주", us: "해외주", coin: "코인" };
  const POS_NEWS = [
    "깜짝 실적에 매수세 폭발 🚀",
    "대형 호재 공시 📈",
    "글로벌 기관 대량 매수 🔥",
    "신제품 흥행 기대감 ✨",
  ];
  const NEG_NEWS = [
    "예상 밖 악재로 투매 📉",
    "규제 리스크 부각 ⚠️",
    "대량 매도 물량 출회 🐻",
    "실적 쇼크 우려 ❄️",
  ];

  let S = {};
  let rng = Math.random;
  let charts = [null, null];

  // ===== 테마(라이트/다크) + 결과 연출 =====
  let THEME = {
    up: "#f04452",
    down: "#3182f6",
    grid: "#f2f4f6",
    tick: "#8b95a1",
  };
  function refreshTheme() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    THEME = dark
      ? { up: "#ff5b67", down: "#4d8eff", grid: "#2a2a31", tick: "#6b7178" }
      : { up: "#f04452", down: "#3182f6", grid: "#f2f4f6", tick: "#8b95a1" };
    charts.forEach((c) => {
      if (c) {
        c.options.scales.y.grid.color = THEME.grid;
        c.options.scales.y.ticks.color = THEME.tick;
        c.update("none");
      }
    });
    if (detailChart) {
      detailChart.options.scales.y.grid.color = THEME.grid;
      detailChart.options.scales.y.ticks.color = THEME.tick;
      detailChart.update("none");
    }
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    try {
      localStorage.setItem("sb-theme", theme);
    } catch (e) {}
    const sw = document.getElementById("theme-switch");
    if (sw) sw.classList.toggle("on", theme === "dark");
    const sw2 = document.getElementById("lobby-theme-switch");
    if (sw2) sw2.classList.toggle("on", theme === "dark");
    refreshTheme();
  }
  // 수익률 카운트업 (0 → 최종값)
  function countUp(el, to) {
    const dur = 650,
      t0 = performance.now();
    el.classList.add("counting");
    (function frame(t) {
      const p = Math.min(1, (t - t0) / dur),
        e = 1 - Math.pow(1 - p, 3),
        v = to * e;
      el.textContent = (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
      if (p < 1) requestAnimationFrame(frame);
      else {
        el.textContent = (to >= 0 ? "+" : "") + to.toFixed(2) + "%";
        el.classList.remove("counting");
      }
    })(performance.now());
  }
  // 1등 컨페티
  function confetti() {
    const colors = ["#ff5b67", "#4d8eff", "#ffd54a", "#7c5cff", "#22c55e"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.5 + Math.random() * 1.4 + "s";
      c.style.animationDelay = Math.random() * 0.3 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }
  // 등수별 결과 연출 (메달 + 톤)
  function celebrate(rank, liquidated) {
    const hero = document.getElementById("result-hero"),
      medal = document.getElementById("r-medal");
    hero.classList.remove("win", "liq");
    if (liquidated) {
      hero.classList.add("liq");
      medal.textContent = "💀";
    } else if (rank === 1) {
      hero.classList.add("win");
      medal.textContent = "🏆";
      confetti();
    } else if (rank === 2) {
      medal.textContent = "🥈";
    } else if (rank === 3) {
      medal.textContent = "🥉";
    } else {
      medal.textContent = "📊";
    }
  }

  const FALLBACK = {
    "000660.KS": 235000,
    "005930.KS": 78000,
    "035720.KS": 42000,
    "035420.KS": 180000,
    AAPL: 230,
    TSLA: 350,
    NVDA: 140,
    MSFT: 430,
    bitcoin: 95000000,
    ethereum: 4800000,
    solana: 320000,
    ripple: 3500,
  };

  // ---------- 시드 PRNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss() {
    let u = 0,
      v = 0;
    while (!u) u = rng();
    while (!v) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------- 설정 화면 ----------
  const setup = { category: "kr", leverage: 1, durationMin: 3 };
  function renderMarketHint() {
    document.getElementById("market-hint").textContent =
      "종목: " + INSTR[setup.category].map((x) => x[1]).join(" · ");
  }
  function bindSeg(id, attr, key, target, after) {
    document.getElementById(id).addEventListener("click", (e) => {
      const btn = e.target.closest(".seg-btn");
      if (!btn) return;
      e.currentTarget
        .querySelectorAll(".seg-btn")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      target[key] = isNaN(+btn.dataset[attr])
        ? btn.dataset[attr]
        : +btn.dataset[attr];
      if (after) after();
    });
  }
  bindSeg("seg-category", "cat", "category", setup, renderMarketHint);
  bindSeg("seg-leverage", "lev", "leverage", setup);
  bindSeg("seg-duration", "min", "durationMin", setup);
  renderMarketHint();

  document.getElementById("btn-start").onclick = () => {
    const input = document.getElementById("in-nickname");
    const nick = input.value.trim();
    const err = document.getElementById("nick-err");
    if (!nick) {
      input.classList.add("invalid");
      err.textContent = "닉네임을 입력해주세요";
      input.focus();
      return;
    }
    input.classList.remove("invalid");
    err.textContent = "";
    const email = document.getElementById("in-email").value.trim();
    const items = INSTR[setup.category].map(([symbol, label]) => ({
      category: setup.category,
      symbol,
      label,
    }));

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((prices) =>
          startGame(nick, email, items, prices, "live"),
        )
        .withFailureHandler(() =>
          startGame(nick, email, items, null, "fallback"),
        )
        .getSeedPrices(
          items.map((i) => ({ category: i.category, symbol: i.symbol })),
        );
    } else {
      startGame(nick, email, items, null, "sim");
    }
  };

  // ---------- 게임 시작 ----------
  function startGame(nick, email, items, prices, source) {
    var lx0 = document.getElementById("liq-exit");
    if (lx0) lx0.style.display = "none";
    const seed = (Math.random() * 0x7fffffff) | 0;
    rng = mulberry32(seed);
    const priceMap = {};
    if (prices) prices.forEach((p) => (priceMap[p.symbol] = p.price));

    const instruments = items.map((it) => {
      const p = priceMap[it.symbol] || FALLBACK[it.symbol] || 100000;
      return {
        symbol: it.symbol,
        label: it.label,
        price: p,
        start: p,
        prev: p,
        hist: [p],
        event: null,
      };
    });

    S = {
      nick,
      email,
      seed,
      source,
      mode: "single",
      roomNews: null,
      category: setup.category,
      durationMin: setup.durationMin,
      durationSec: setup.durationMin * 60,
      totalTicks: Math.round((setup.durationMin * 60) / (TICK_MS / 1000)),
      elapsed: 0,
      tick: 0,
      instruments,
      me: newTrader(nick, "human", setup.leverage),
      bots: [
        newTrader("공격투자봇", "aggro", 2),
        newTrader("존버개미", "hodl", 1),
      ],
      featured: [0, 1],
      log: [],
      news: [],
      startLev: setup.leverage,
      cur: curOf(setup.category),
    };
    S.news = genNewsSchedule();
    S.gameId = "s_" + Date.now() + "_" + ((Math.random() * 1e6) | 0); // 싱글: 한 판이 한 게임
    S.equitySeries = [0]; // 수익률 추이(상세 차트용)

    document.getElementById("g-source").textContent = source;
    document.getElementById("g-brief").textContent =
      "📊 변동성이 큰 장세입니다. 속보가 뜨는 종목을 노려 단타하세요!";
    document.getElementById("g-timer").textContent = fmtTime(S.durationSec);
    fetchAINews();
    show("game");
    initCharts();
    updateCharts();
    updateUI();
    runCountdown(() => {
      S.timer = setInterval(onSecond, 1000);
      S.priceTimer = setInterval(onTick, TICK_MS);
    });
  }

  function newTrader(name, strategy, lev) {
    return {
      name,
      strategy,
      cash: START_MONEY,
      posIdx: -1,
      entryPrice: 0,
      entryCapital: 0,
      leverage: lev || 1,
      liquidated: false,
      levCdTick: 0,
    };
  }
  function instPrice(idx) {
    return S.instruments[idx].price;
  }
  function equity(t) {
    if (t.liquidated) return 0;
    if (t.posIdx < 0) return t.cash;
    return Math.max(
      0,
      t.entryCapital *
        (1 + t.leverage * (instPrice(t.posIdx) / t.entryPrice - 1)),
    );
  }
  function ret(t) {
    return (equity(t) / START_MONEY - 1) * 100;
  }

  // 멀티: 포지션 상태(state)와 공유 시세로 다른 플레이어 수익률을 각자 동일하게 계산
  // finalRet: 게임 종료(또는 청산) 시 그 시점 수익률을 박제. 결과화면·종료 후 순위는 이 값을 우선 사용.
  function myStateJSON(finalRet) {
    const t = S.me;
    const o = {
      posIdx: t.posIdx,
      entryPrice: t.entryPrice,
      entryCapital: t.entryCapital,
      leverage: t.leverage,
      cash: t.cash,
      liquidated: t.liquidated,
    };
    if (finalRet != null) o.finalRet = Math.round(finalRet * 100) / 100;
    return JSON.stringify(o);
  }
  function equityFromState(st) {
    if (!st) return START_MONEY;
    if (st.liquidated) return 0;
    if (st.posIdx == null || st.posIdx < 0) return st.cash;
    return Math.max(
      0,
      st.entryCapital *
        (1 + st.leverage * (instPrice(st.posIdx) / st.entryPrice - 1)),
    );
  }
  function retFromState(st) {
    return (equityFromState(st) / START_MONEY - 1) * 100;
  }
  // 순위 계산용 수익률: finalRet(박제값)이 있으면 그걸, 없으면 실시간 계산.
  function rankRetOfState(st) {
    if (st && st.finalRet != null) return Number(st.finalRet);
    return retFromState(st);
  }

  // 닉네임 기반 고정 색상 아바타 (대기실·기록 공용)
  function nickColor(nick) {
    let h = 0;
    const s = String(nick);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return "hsl(" + (h % 360) + " 60% 50%)";
  }
  function avatarHTML(nick) {
    const s = String(nick || "?");
    return (
      '<span class="avatar" style="background:' +
      nickColor(s) +
      '">' +
      s.charAt(0).toUpperCase() +
      "</span>"
    );
  }

  // ---------- 뉴스 일정 (시드 결정론) ----------
  function genNewsSchedule() {
    const total = S.totalTicks;
    // 게임 분당 약 3.5개 목표, 최소 3개, totalTicks/2 상한으로 과밀 방지
    const base = Math.round(S.durationMin * 3.5);
    const n = Math.max(3, Math.min(base, Math.floor(total / 2)));
    const out = [];
    for (let k = 0; k < n; k++) {
      const at = Math.floor(rng() * total * 0.85) + Math.floor(total * 0.06);
      const idx = Math.floor(rng() * S.instruments.length);
      const dir = rng() < 0.5 ? 1 : -1;
      const label = S.instruments[idx].label;
      let head;
      const tmpl = S.roomNews && S.roomNews[label];
      if (tmpl) {
        head =
          (dir > 0 ? tmpl.pos : tmpl.neg) ||
          label +
            " " +
            (dir > 0 ? POS_NEWS : NEG_NEWS)[
              Math.floor(rng() * POS_NEWS.length)
            ];
      } else {
        const pool = dir > 0 ? POS_NEWS : NEG_NEWS;
        head = label + " " + pool[Math.floor(rng() * pool.length)];
      }
      out.push({ at, idx, dir, head, fired: false });
    }
    return out.sort((a, b) => a.at - b.at);
  }

  // 시작 시 AI 시황/뉴스
  function fetchAINews() {
    if (!(window.google && google.script && google.script.run)) return;
    const items = S.news.map((ev) => ({
      label: S.instruments[ev.idx].label,
      dir: ev.dir,
    }));
    google.script.run
      .withSuccessHandler((res) => {
        if (!res) return;
        if (res.brief)
          document.getElementById("g-brief").textContent = "📊 " + res.brief;
        if (res.heads)
          S.news.forEach((ev, i) => {
            if (res.heads[i] && !ev.fired) ev.head = res.heads[i];
          });
      })
      .withFailureHandler(() => {})
      .aiMarketNews(S.category, items);
  }

  // ---------- 카운트다운 ----------
  function runCountdown(cb) {
    const seq = ["3", "2", "1", "START"];
    const ov = document.getElementById("countdown");
    const el = document.getElementById("cd-num");
    let i = 0;
    ov.classList.add("show");
    (function step() {
      if (i >= seq.length) {
        ov.classList.remove("show");
        cb();
        return;
      }
      el.textContent = seq[i];
      el.classList.toggle("start", seq[i] === "START");
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
      sfx(seq[i] === "START" ? "go" : "count");
      i++;
      setTimeout(step, 700);
    })();
  }

  // ---------- 타이머 / 틱 ----------
  function onSecond() {
    S.elapsed++;
    const left =
      S.mode === "multi" && S.endAt
        ? Math.round((S.endAt - nowSync()) / 1000)
        : S.durationSec - S.elapsed;
    const el = document.getElementById("g-timer");
    el.textContent = fmtTime(Math.max(0, left));
    el.classList.toggle("urgent", left <= 10);
    updateLevButton();
    if (left <= 0) endGame();
  }
  function onTick() {
    S.tick++;
    S.news.forEach((ev) => {
      if (!ev.fired && S.tick >= ev.at) {
        ev.fired = true;
        S.instruments[ev.idx].event = {
          left: EVENT_TICKS,
          total: EVENT_TICKS,
          dir: ev.dir,
        };
        showNews("📰 " + ev.head);
        sfx("news");
      }
    });
    S.instruments.forEach((inst) => {
      inst.prev = inst.price;
      let vol = VOL,
        drift = 0;
      if (inst.event) {
        const phase = 1 - inst.event.left / inst.event.total;
        drift =
          phase < 0.4
            ? inst.event.dir * EVENT_DRIFT
            : -inst.event.dir * EVENT_DRIFT * 0.65;
        vol = VOL * 1.4;
        inst.event.left--;
        if (inst.event.left <= 0) inst.event = null;
      }
      inst.price = Math.max(0.0001, inst.price * (1 + gauss() * vol + drift));
      inst.hist.push(inst.price);
      if (inst.hist.length > 120) inst.hist.shift();
    });
    [S.me, ...S.bots].forEach((t) => {
      if (t.posIdx >= 0 && !t.liquidated && equity(t) <= 0) {
        if (t === S.me)
          logEvt(
            "liq",
            S.instruments[t.posIdx].label,
            instPrice(t.posIdx),
            t.leverage,
            null,
          );
        t.liquidated = true;
        t.posIdx = -1;
        if (t === S.me) liquidationFX();
        if (t === S.me && S.mode === "multi") syncMyState(false);
      }
    });
    if (S.mode === "multi") {
      maybeSyncMulti();
      checkMultiEarlyEnd();
    } else botThink();
    updateCharts();
    updateUI();
    if (S.equitySeries) S.equitySeries.push(Math.round(ret(S.me) * 100) / 100); // 추이 기록
  }

  // ---------- 매매 / 레버리지 ----------
  function enter(t, idx) {
    t.posIdx = idx;
    t.entryPrice = instPrice(idx);
    t.entryCapital = t.cash * (1 - FEE_RATE); // 매수 수수료 0.1% 차감
    if (t.strategy === "human")
      logEvt("buy", S.instruments[idx].label, t.entryPrice, t.leverage, null);
  }
  function sell(t, silent) {
    if (t.posIdx < 0) return false;
    const idx = t.posIdx,
      eq = equity(t) * (1 - FEE_RATE),
      pnl = eq - t.entryCapital; // 매도 수수료 0.1% 차감
    t.cash = eq;
    t.posIdx = -1;
    t.entryPrice = 0;
    t.entryCapital = 0;
    if (t.strategy === "human" && !silent)
      logEvt("sell", S.instruments[idx].label, instPrice(idx), t.leverage, pnl);
    return true;
  }
  function buy(t, idx) {
    if (t.liquidated || t.posIdx === idx) return;
    if (t.posIdx >= 0) sell(t);
    enter(t, idx);
  }
  function bumpLev(t) {
    const i = LEV_STEPS.indexOf(t.leverage);
    if (i >= LEV_STEPS.length - 1) return false;
    if (S.tick < t.levCdTick) return false;
    if (t.posIdx >= 0) {
      const eq = equity(t);
      t.entryCapital = eq * (1 - FEE_RATE);
      t.entryPrice = instPrice(t.posIdx);
    } // 재진입 수수료
    t.leverage = LEV_STEPS[i + 1];
    t.levCdTick = S.tick + COOLDOWN_TICKS;
    if (t.strategy === "human")
      logEvt(
        "levup",
        t.posIdx >= 0 ? S.instruments[t.posIdx].label : "-",
        t.posIdx >= 0 ? instPrice(t.posIdx) : 0,
        t.leverage,
        null,
      );
    return true;
  }
  // 거래 로그: 통화 단위(cur)도 같이 저장 → 상세 타임라인에서 $/원 정확히 표기
  function logEvt(type, label, price, lev, pnl) {
    S.log.push({
      sec: S.elapsed,
      type,
      label,
      price: Math.round(price),
      lev,
      pnl: pnl == null ? null : Math.round(pnl),
      cur: S.cur,
    });
  }

  // 멀티 조기종료: 살아있는(=청산 안 된) 플레이어가 1명 이하면 게임 끝
  function checkMultiEarlyEnd() {
    if (S.mode !== "multi" || S._over) return;
    // 나 + 다른 플레이어들의 청산 여부 집계
    var aliveCount = 0;
    if (!S.me.liquidated) aliveCount++;
    (S.players || []).forEach(function (p) {
      if (String(p.nick) === String(S.nick)) return; // 나는 위에서 셈
      var st = p.state;
      var dead = st && st.liquidated;
      if (!dead) aliveCount++;
    });
    // 참가자가 2명 이상인 게임에서만 (1인 방은 시간 만료로 끝)
    var total = (S.players || []).length || 1;
    if (total >= 2 && aliveCount <= 1) endGame();
  }

  };

  // ---------- AI 봇 (시드 결정론) ----------
  function randInst() {
    return Math.floor(rng() * S.instruments.length);
  }
  function botThink() {
    S.bots.forEach((b) => {
      if (b.liquidated) return;
      if (b.strategy === "aggro") {
        if (b.posIdx < 0) {
          if (rng() < 0.3) buy(b, randInst());
        } else {
          if (rng() < 0.25) sell(b);
          else if (rng() < 0.2) buy(b, randInst());
          else if (rng() < 0.3) bumpLev(b);
        }
      } else {
        if (b.posIdx < 0) {
          if (rng() < 0.12) buy(b, randInst());
        } else {
          if (rng() < 0.04) sell(b);
          else if (rng() < 0.04) bumpLev(b);
        }
      }
    });
  }

  // ---------- 차트 ----------
  const liqLinePlugin = {
    id: "liqLine",
    afterDraw(c) {
      if (!S.me || S.me.posIdx < 0 || S.me.liquidated || c._idx !== S.me.posIdx)
        return;
      const L = S.me.leverage;
      if (L <= 1) return;
      const liq = S.me.entryPrice * (1 - 1 / L);
      const y = c.scales.y;
      if (liq < y.min || liq > y.max) return;
      const py = y.getPixelForValue(liq),
        a = c.chartArea,
        ctx = c.ctx;
      // 청산선은 차트선(빨강/파랑)과 안 겹치게 주황 계열 + 라벨에 배경칩을 깔아 항상 또렷하게.
      const LINE = "#ff8f1f",
        BGTXT = "#ffffff";
      ctx.save();
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(a.left, py);
      ctx.lineTo(a.right, py);
      ctx.stroke();
      ctx.setLineDash([]);
      // 라벨 배경칩
      ctx.font = "bold 10px Pretendard";
      const txt = "청산선 " + fmtMoney(liq, S.cur);
      const tw = ctx.measureText(txt).width;
      const ly = py - 12,
        lx = a.left + 4;
      ctx.fillStyle = LINE;
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(lx, ly, tw + 12, 15, 4);
        ctx.fill();
      } else {
        ctx.fillRect(lx, ly, tw + 12, 15);
      }
      ctx.fillStyle = BGTXT;
      ctx.textBaseline = "middle";
      ctx.fillText(txt, lx + 6, ly + 8);
      ctx.restore();
    },
  };
  function makeChart(canvasId) {
    var ex = Chart.getChart(canvasId);
    if (ex) ex.destroy();
    return new Chart(document.getElementById(canvasId), {
      type: "line",
      data: {
        labels: [],
        datasets: [
          {
            data: [],
            borderColor: "#3182f6",
            borderWidth: 2,
            fill: true,
            backgroundColor: "rgba(49,130,246,.08)",
            tension: 0.3,
            pointRadius: 0,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { display: false },
          y: {
            display: true,
            ticks: { color: THEME.tick, font: { size: 9 } },
            grid: { color: THEME.grid },
          },
        },
      },
      plugins: [liqLinePlugin],
    });

  function initCharts() {

  function updateCharts() {
    charts.forEach((c, k) => {

      const inst = S.instruments[S.featured[k]];
      const up = inst.price >= inst.start;
      c._idx = S.featured[k];
      c.data.labels = inst.hist.map((_, i) => i);
      c.data.datasets[0].data = inst.hist;
      c.data.datasets[0].borderColor = up ? THEME.up : THEME.down;
      c.data.datasets[0].backgroundColor = up
        ? "rgba(240,68,82,.08)"
        : "rgba(49,130,246,.08)";

    });

  }
  function updateChartHeads() {
    [
      ["cA", 0],
      ["cB", 1],

      } catch (e) {}
      document.body.removeChild(ta);

    this.textContent = ok ? "복사됨 ✓" : "복사 실패 (텍스트 길게 눌러 복사)";

  // AI 피드백용 거래 요약 (기록 그대로, 지어내기 방지)
  function buildLogSummary(rank, total, myRet) {
    const lines = S.log
      .map((e) => {
        const t = fmtTime(e.sec);
        if (e.type === "buy")
          return `[${t}] 매수 ${e.label} @${fmtMoney(e.price, e.cur)} (${e.lev}배)`;
        if (e.type === "sell")
          return `[${t}] 매도 ${e.label} @${fmtMoney(e.price, e.cur)} 손익 ${e.pnl >= 0 ? "+" : ""}${e.pnl}`;
        if (e.type === "levup") return `[${t}] 레버리지 ${e.lev}배로 상향`;
        if (e.type === "liq")
          return `[${t}] 청산 ${e.label} @${fmtMoney(e.price, e.cur)}`;
        return "";
      })
      .filter(Boolean);
    const news = S.news
      .filter((n) => n.fired)
      .map(
        (n) => `[${fmtTime(Math.round((n.at * TICK_MS) / 1000))}] ${n.head}`,
      );
    return (
      "시장:" +
      CAT_LABEL[S.category] +
      " / 게임시간:" +
      S.durationMin +
      "분 / 시작레버리지:" +
      (S.startLev != null ? S.startLev : setup.leverage) +
      "배\n" +
      "뉴스:\n" +
      (news.join("\n") || "없음") +

      myRet.toFixed(2) +
      "% / " +
      total +
      "명 중 " +
      rank +
      "위"
    );

  // ---------- AI 피드백 표시 포맷 (가독성) ----------
  // [사실]/[해석]/[조언] 라벨과 [00:12] 시간대 앞에서 줄바꿈해 읽기 쉽게.
  // 옛 기록(라벨 없는 한 덩어리)도 동일 처리. 서버 응답은 안 건드림.
  function formatFeedback(raw) {
    if (!raw) return "";
    var s = String(raw).trim();
    // 라벨 앞 줄바꿈: [사실][해석][조언] (맨 앞 라벨은 줄바꿈 안 함)
    s = s.replace(/\s*(\[(?:사실|해석|조언)\])/g, function (m, tag, off) {
      return off === 0 ? tag : "\n" + tag;
    });
    // 시간대 [00:12] 앞 줄바꿈 (문장 중간에 여러 개 섞인 경우)
    s = s.replace(/\s*(\[\d{1,2}:\d{2}\])/g, function (m, tag, off) {
      return off === 0 ? tag : "\n" + tag;
    });
    return s.replace(/\n{3,}/g, "\n\n").trim();
  }
  // 피드백을 라벨별 칩 + 본문 구조로 렌더 (라벨 있으면 예쁘게, 없으면 줄바꿈 텍스트)
  function renderAIFeedback(el, fb, logCount) {
    el.className = "ai-feedback";
    if (!fb) {
      el.textContent =
        "AI 분석을 불러오지 못했어요 (API 키/쿼터 확인). 거래 " +
        (logCount || 0) +
        "건 기록됨.";
      return;
    }
    var txt = formatFeedback(fb);
    // 라벨 단위로 쪼개서 칩+문장 블록 생성
    var hasLabel = /\[(사실|해석|조언)\]/.test(txt);
    if (!hasLabel) {
      el.innerHTML =
        '<div class="fb-line">' +
        txt.split("\n").map(escapeHtml).join("<br>") +
        "</div>";
      return;
    }
    var html = "";
    // 첫 라벨 이전의 인사말(있으면) 분리
    var firstIdx = txt.search(/\[(사실|해석|조언)\]/);
    if (firstIdx > 0) {
      var intro = txt.slice(0, firstIdx).trim();
      if (intro)
        html += '<div class="fb-intro">' + escapeHtml(intro) + "</div>";
    }
    var rest = txt.slice(firstIdx);
    var parts = rest.split(/\n(?=\[(?:사실|해석|조언)\])/);
    parts.forEach(function (p) {
      p = p.trim();
      if (!p) return;
      var m = p.match(/^\[(사실|해석|조언)\]\s*([\s\S]*)$/);
      if (m) {
        var tag = m[1],
          body = m[2].trim();
        var cls =
          tag === "사실" ? "fb-fact" : tag === "해석" ? "fb-read" : "fb-tip";
        html +=
          '<div class="fb-block"><span class="fb-tag ' +
          cls +
          '">' +
          tag +
          '</span><span class="fb-body">' +
          escapeHtml(body).replace(/\n/g, "<br>") +
          "</span></div>";
      } else {
        html +=
          '<div class="fb-line">' +
          escapeHtml(p).replace(/\n/g, "<br>") +
          "</div>";
      }
    });
    el.innerHTML = html;
  }

  function escapeHtml(s) {

  // 수익률 추이 라인차트 (상세) — 0% 기준 위=빨강(이익)/아래=파랑(손실), 0선 점선
  const zeroLinePlugin = {
    id: "zeroLine",
    afterDraw(c) {
      const y = c.scales.y;
      if (!y) return;
      if (0 < y.min || 0 > y.max) return;
      const py = y.getPixelForValue(0),
        a = c.chartArea,
        ctx = c.ctx;
      ctx.save();
      ctx.strokeStyle =
        document.documentElement.getAttribute("data-theme") === "dark"
          ? "#5a6068"
          : "#b0b8c1";
      ctx.lineWidth = 1.2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(a.left, py);
      ctx.lineTo(a.right, py);
      ctx.stroke();
      ctx.restore();
    },
  };
  function renderDetailChart(retSeries) {
    const card = document.getElementById("d-chart-card");
    var ex = Chart.getChart("d-chart");
    if (ex) ex.destroy();
    detailChart = null;
    if (!retSeries || retSeries.length < 2) {
      card.style.display = "none";
      return;
    }
    card.style.display = "";
    // segment 색: 두 점 중 하나라도 0 미만이면 손실색(파랑), 아니면 이익색(빨강)
    const upC = THEME.up,
      downC = THEME.down;
    const segColor = (ctx) => {
      const a = ctx.p0.parsed.y,
        b = ctx.p1.parsed.y;
      return a < 0 || b < 0 ? downC : upC;
    };
    detailChart = new Chart(document.getElementById("d-chart"), {
      type: "line",
      data: {
        labels: retSeries.map((_, i) => i),
        datasets: [
          {
            data: retSeries,
            borderColor: upC,
            borderWidth: 2,
            fill: true,
            backgroundColor: "rgba(120,130,145,.06)",
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: upC,
            segment: { borderColor: segColor },
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: "index", intersect: false }, // hover/touch 어디를 짚어도 가까운 지점 표시
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true,
            displayColors: false,
            callbacks: {
              // x축 라벨(인덱스) → 경과 시간. 추이는 매 틱(TICK_MS) 1포인트로 쌓임.
              title: (items) => {
                const i = items[0].dataIndex;
                return fmtTime(Math.round((i * TICK_MS) / 1000));
              },
              label: (item) => {
                const v = item.parsed.y;
                return (v >= 0 ? "+" : "") + Number(v).toFixed(2) + "%";
              },
            },
          },
        },
        scales: {
          x: { display: false },
          y: {
            display: true,
            ticks: {
              color: THEME.tick,
              font: { size: 9 },
              callback: (v) => v + "%",
            },
            grid: { color: THEME.grid },
          },
        },
      },
      plugins: [zeroLinePlugin],
    });
  }
  // 거래 타임라인 HTML (색 배지 + 손익) — 유저 친화 문구 + 통화 표기
  function tradeTimelineHTML(log) {
    if (!log || !log.length)
      return '<div class="tl-empty">거래 없음 (관망)</div>';
    return log
      .map((e) => {
        const t = fmtTime(e.sec);
        let cls,
          label,
          main = "";
        if (e.type === "buy") {
          cls = "tl-buy";
          label = "매수";
          main =
            e.label +
            " " +
            fmtMoney(e.price, e.cur) +
            "에 매수 · " +
            e.lev +
            "배";
        } else if (e.type === "sell") {
          cls = "tl-sell";
          label = "매도";
          main = e.label + " " + fmtMoney(e.price, e.cur) + "에 매도";
        } else if (e.type === "levup") {
          cls = "tl-lev";
          label = "레버리지";
          main = "레버리지 " + e.lev + "배로 올림";
        } else if (e.type === "liq") {
          cls = "tl-liq";
          label = "청산";
          main = e.label + " " + fmtMoney(e.price, e.cur) + "에서 청산";
        } else return "";
        const pnl =
          e.type === "sell" && e.pnl != null
            ? `<span class="tl-pnl ${e.pnl >= 0 ? "up" : "down"}">${e.pnl >= 0 ? "+" : ""}${fmtNum(e.pnl)}</span>`
            : "";
        return `<div class="tl-row"><span class="tl-time">${t}</span><span class="tl-type ${cls}">${label}</span><span class="tl-main">${main}</span>${pnl}</div>`;
      })
      .join("");
  }

    const err = document.getElementById("j-err");
    const btn = document.getElementById("btn-join");
    if (!code) {
      err.textContent = "방 코드를 입력해주세요";
      document.getElementById("j-code").focus();
      return;
    }
    if (!nick) {
      err.textContent = "닉네임을 입력해주세요";
      document.getElementById("j-nickname").focus();
      return;
    }
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "입장 중...";
    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.textContent = "입장하기";
        if (res && res.error) {
          if (res.error === "NICK_TAKEN")
            err.textContent =
              "이미 사용 중인 닉네임이에요. 다른 닉네임을 써주세요.";
          else if (res.error === "ALREADY_STARTED")
            err.textContent = "이미 시작된 게임이에요.";
          else if (res.error === "ROOM_FULL")
            err.textContent = "방이 가득 찼어요 (최대 8명).";
          else err.textContent = "방을 찾을 수 없어요 (" + code + ")";
          return;
        }
        enterLobby(code, nick, false, res.inviteUrl, email);
      })
      .withFailureHandler(() => {
        btn.disabled = false;
        btn.textContent = "입장하기";
        err.textContent = "입장 실패. 다시 시도해줘.";
      })
      .joinRoom(code, nick, email);
  };

  function enterLobby(roomId, nick, isHost, inviteUrl, email) {
    stopResultHeartbeat();
    MP = {
      roomId,
      nick,
      isHost,
      inviteUrl: inviteUrl || "",
      lastStart: 0,
      email: email || (MP && MP.email) || "",
    };
    document.getElementById("l-code").textContent = roomId;
    document.getElementById("btn-startroom").textContent = "게임 시작";
    document.getElementById("btn-startroom").disabled = false;
    applyHostUI(isHost);
    document.getElementById("l-link").textContent = "";
    try {
      google.script.url.getLocation(function (loc) {
        if (loc && loc.url) {
          MP.inviteUrl = loc.url.split("?")[0] + "?room=" + roomId;
          document.getElementById("l-link").textContent = MP.inviteUrl;
        }
      });
    } catch (e) {}
    show("lobby");
    pollLobby();
    MP.pollTimer = setInterval(pollLobby, 1500);
    // 하트비트: 대기실에 머무는 동안 내 updatedAt 갱신 (유령 오판정 방지)
    heartbeat();
    MP.hbTimer = setInterval(heartbeat, 7000);
  }
  // 방장 여부에 따라 시작버튼/대기문구/설정버튼 표시 (위임으로 바뀔 수 있어 분리)
  function applyHostUI(isHost) {
    document.getElementById("btn-startroom").style.display = isHost
      ? ""
      : "none";
    document.getElementById("l-wait").style.display = isHost ? "none" : "";
    document.getElementById("btn-lobby-settings").style.display = isHost
      ? ""
      : "none";
  }
  // 대기실/결과화면에서 내 생존 신호만 보냄 (state는 그대로, updatedAt만 갱신)
  function heartbeat() {
    if (
      !(MP && MP.roomId && window.google && google.script && google.script.run)
    )
      return;
    google.script.run
      .withSuccessHandler(() => {})
      .withFailureHandler(() => {})
      .touchPlayer(MP.roomId, MP.nick);
  }
  function pollLobby() {
    google.script.run
      .withSuccessHandler(onLobby)
      .withFailureHandler(() => {})
      .getLobby(MP.roomId);
  }
  function onLobby(d) {
    if (!d || d.error) return;
    MP.room = d;
    // 방장 위임 반영: 매 폴링마다 내가 방장인지 재판정
    const iAmHost = String(d.host) === String(MP.nick);
    if (iAmHost !== MP.isHost) {
      MP.isHost = iAmHost;
      applyHostUI(iAmHost);
    }
    const ul = document.getElementById("l-players");
    ul.innerHTML = "";
    const seen = {};
    const plist = (d.players || []).filter((p) => {
      const k = String(p.nick);
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    });
    plist.forEach((p) => {
      const host = String(p.nick) === String(d.host);
      const li = document.createElement("li");
      li.className =
        "lobby-row" + (String(p.nick) === String(MP.nick) ? " me" : "");
      li.innerHTML = `${avatarHTML(p.nick)}<span class="lobby-nick">${p.nick}</span>${host ? '<span class="host-tag">👑 방장</span>' : ""}`;
      ul.appendChild(li);
    });
    document.getElementById("l-count").textContent = "(" + plist.length + "명)";
    document.getElementById("l-info").textContent =
      CAT_LABEL[d.category] +
      " · 시작 레버리지 " +
      d.leverage +
      "배 · " +
      d.durationMin +
      "분";
    if (d.inviteUrl && !MP.inviteUrl) {
      MP.inviteUrl = d.inviteUrl;
      document.getElementById("l-link").textContent = MP.inviteUrl;
    }
    if (d.status === "playing" && d.startTime && d.startTime > MP.lastStart) {
      MP.lastStart = d.startTime;
      clearInterval(MP.pollTimer);
      clearInterval(MP.hbTimer);
      startMultiGame(d);
    }
  }
  document.getElementById("btn-startroom").onclick = function () {
    this.disabled = true;
    this.textContent = "시작 중...";
    google.script.run
      .withSuccessHandler(() => {})

        this.disabled = false;
        this.textContent = "게임 시작";
      })
      .startRoom(MP.roomId);
  };
  // 대기실 나가기 = 서버에서 진짜 방 나가기
  document.getElementById("lobby-leave").onclick = () => {
    clearInterval(MP.pollTimer);
    clearInterval(MP.hbTimer);

  // 대기실 조건 변경 모달
  const lobbySettingsModal = document.getElementById("lobby-settings-modal");
  const lsSetup = { category: "kr", leverage: 1, durationMin: 3 };

  document.getElementById("ls-close").onclick = () =>

  lobbySettingsModal.addEventListener("click", function (e) {

  bindSeg("ls-seg-category", "cat", "category", lsSetup);
  bindSeg("ls-seg-leverage", "lev", "leverage", lsSetup);
  bindSeg("ls-seg-duration", "min", "durationMin", lsSetup);

  document.getElementById("btn-ls-apply").onclick = function () {
    if (!(window.google && google.script && google.script.run)) return;
    const btn = this;
    btn.disabled = true;
    btn.textContent = "적용 중...";
    google.script.run
      .withSuccessHandler((res) => {

        if (!MP.room || MP.room.category !== lsSetup.category) {

          google.script.run
            .withSuccessHandler(() => {})

            .prepareRoomNews(MP.roomId, lsSetup.category, labels);
        }
      })
      .withFailureHandler(() => {
        btn.disabled = false;
        btn.textContent = "적용";
        alert("변경 실패. 다시 시도해줘.");
      })
      .updateRoomSettings(MP.roomId, {
        category: lsSetup.category,
        leverage: lsSetup.leverage,
        durationMin: lsSetup.durationMin,
      });
  };
  document.getElementById("l-copy").onclick = async function () {
    const url = MP.inviteUrl || "";
    const text = "StockBattle 주식 대결에 초대합니다! 방 코드 " + MP.roomId;
    if (navigator.share) {
      try {
        await navigator.share({
          title: "StockBattle 초대",
          text: text,
          url: url || undefined,
        });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    const copyText = url || text;
    let ok = false;
    try {
      await navigator.clipboard.writeText(copyText);
      ok = true;
    } catch (e) {}
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        ok = document.execCommand("copy");
      } catch (e) {}
      document.body.removeChild(ta);
    }
    this.textContent = ok
      ? "링크 복사됨 ✓ 붙여넣어 공유하세요"
      : "복사 실패 (아래 링크를 길게 눌러 복사)";
  };

  // 멀티 게임 시작 (시드 공유 → 가격/뉴스 전원 동일)
  function startMultiGame(d) {
    var lx0 = document.getElementById("liq-exit");
    if (lx0) lx0.style.display = "none";
    rng = mulberry32(d.seed);
    const items = INSTR[d.category].map(([symbol, label]) => ({
      symbol,
      label,
    }));
    const instruments = items.map((it) => {
      const p = FALLBACK[it.symbol] || 100000;
      return {
        symbol: it.symbol,
        label: it.label,
        price: p,
        start: p,
        prev: p,
        hist: [p],
        event: null,
      };
    });
    S = {
      nick: MP.nick,
      email: MP.email || "",
      seed: d.seed,
      source: "멀티",
      mode: "multi",
      roomId: MP.roomId,
      category: d.category,
      durationMin: d.durationMin,
      durationSec: d.durationMin * 60,
      totalTicks: Math.round((d.durationMin * 60) / (TICK_MS / 1000)),
      elapsed: 0,
      tick: 0,
      instruments,
      me: newTrader(MP.nick, "human", d.leverage),
      bots: [],
      featured: [0, 1],
      log: [],
      news: [],
      roomNews: d.news || {},
      players: d.players || [],
      syncEvery: 2,
      startLev: d.leverage,
      startTime: d.startTime,
      cur: curOf(d.category),
    };
    S.news = genNewsSchedule();
    S.gameId = "r_" + MP.roomId + "_" + d.startTime; // 같은 방·같은 라운드 = 전원 동일 gameId
    S.equitySeries = [0];
    S.clockOffset = d.serverNow ? d.serverNow - Date.now() : 0;
    S.endAt = d.startTime + COUNTDOWN_MS + S.durationSec * 1000;
    // fetchAINews는 멀티에서 호출 안 함: roomNews(prepareRoomNews로 공유된)를 쓰므로 전원 동일 헤드라인 보장
    document.getElementById("g-source").textContent = "멀티";
    document.getElementById("g-brief").textContent =
      "📊 친구들과 실시간 대결! 같은 시장·같은 뉴스로 승부.";
    document.getElementById("g-timer").textContent = fmtTime(S.durationSec);
    show("game");
    initCharts();
    updateCharts();
    updateUI();
    const delay = Math.max(0, d.startTime - nowSync());
    setTimeout(() => {
      runCountdown(() => {
        S.timer = setInterval(onSecond, 1000);
        S.priceTimer = setInterval(onTick, TICK_MS);
      });
    }, delay);
  }

  // 내 포지션 상태 업로드 + 전체 명단(상태) 갱신
  function syncMyState(finished, finalRet) {
    if (S.mode !== "multi") return;
    if (!(window.google && google.script && google.script.run)) return;
    if (S.ended && !finished) return;
    google.script.run
      .withSuccessHandler((ps) => {
        if (ps && (!S.ended || finished)) S.players = mergePlayers(ps);
      })
      .withFailureHandler(() => {})
      .updatePlayer(S.roomId, S.nick, myStateJSON(finalRet), !!finished);
  }
  function maybeSyncMulti() {
    if (S.tick % S.syncEvery === 0) syncMyState(false);
  }

  // 서버 명단 병합: 이미 finalRet(박제값)을 알고 있는 플레이어는 그 값을 유지.
  // (종료한 플레이어가 결과화면에서 finished:true로 올린 state엔 finalRet이 들어있음.
  //  아직 안 끝난 플레이어가 폴링으로 덮어쓸 때 박제값이 날아가지 않게 보존.)
  function mergePlayers(ps) {
    if (!ps) return S.players || [];
    const prev = {};
    (S.players || []).forEach((p) => {
      prev[String(p.nick)] = p;
    });
    return ps.map((p) => {
      const old = prev[String(p.nick)];
      const oldFinal = old && old.state && old.state.finalRet;
      if (oldFinal != null && (!p.state || p.state.finalRet == null)) {
        p.state = p.state || {};
        p.state.finalRet = oldFinal;
      }
      return p;
    });
  }

  // 멀티 순위: 각자 보유 상태 + 공유 시세로 전원 수익률 동일 계산.
  // reveal=false(게임 중)면 수익률 숨김 — 단, 청산된 본인 화면에서는 보여준다(요청사항).
  function renderRankMulti(reveal) {
    const byNick = {};
    (S.players || []).forEach((p) => {
      byNick[String(p.nick)] = {
        nick: String(p.nick),
        ret: rankRetOfState(p.state),
      };
    });
    const meKey = String(S.nick);
    byNick[meKey] = { nick: meKey, ret: ret(S.me) };
    const list = Object.keys(byNick)
      .map((k) => byNick[k])
      .sort((a, b) => b.ret - a.ret);
    const ul = document.getElementById(reveal ? "r-rank-list" : "g-rank");
    ul.innerHTML = "";
    // 게임 중에도 수익률을 보일지: reveal(종료) or 내가 청산됨 or 막판(durationMin별 임계치)
    const showVal =
      reveal || (S.me && S.me.liquidated) || secondsLeft() <= revealThreshold();
    list.forEach((p, i) => {
      const me = p.nick === meKey,
        r = p.ret;
      const li = document.createElement("li");
      li.className = "rank-row" + (me ? " me" : "");
      li.innerHTML = `<span class="rank-no">${i + 1}</span>
      <span class="rank-name">${p.nick}</span>
      <span class="rank-val ${r >= 0 ? "up" : "down"}" ${showVal ? "" : 'style="display:none"'}>${(r >= 0 ? "+" : "") + r.toFixed(2)}%</span>`;
      ul.appendChild(li);
    });
    return list;
  }

  function endGameMulti() {
    S.ended = true;
    const myRet = ret(S.me);
    show("result");
    // 결과화면에서도 하트비트 유지: 내가 결과화면에 머무는 동안 유령 처리되지 않도록.
    startResultHeartbeat();
    try {
      document.getElementById("r-email-note").textContent =
        "친구와의 실시간 대결 결과입니다.";
    } catch (e) {}
    let done = false;
    const setupResult = (ps) => {
      if (done) return;
      done = true;
      if (ps) S.players = mergePlayers(ps);
      let myRank = 1;
      try {
        myRank = paintMulti(myRet);
      } catch (e) {}
      try {
        sfx(myRank === 1 ? "win" : "sell");
      } catch (e) {}
      try {
        celebrate(myRank, S.me.liquidated);
        countUp(document.getElementById("r-return"), myRet);
      } catch (e) {}
      try {
        triggerMultiAI(myRank, myRet);
      } catch (e) {}
      let tries = 0;
      const poll = () => {
        tries++;
        google.script.run
          .withSuccessHandler((p2) => {
            if (p2) S.players = mergePlayers(p2);
            try {
              paintMulti(myRet);
            } catch (e) {}
            const all =
              (S.players || []).length && S.players.every((x) => x.finished);
            if (!(all && tries >= 2) && tries < 10) setTimeout(poll, 1500);
          })
          .withFailureHandler(() => {
            if (tries < 10) setTimeout(poll, 1500);
          })
          .getRoomPlayers(S.roomId);
      };
      setTimeout(poll, 1500);
    };
    if (window.google && google.script && google.script.run) {
      // 종료 시점 내 최종 수익률(myRet)을 state에 박제해서 올린다 → 다른 사람 결과화면에서 내 값이 고정.
      google.script.run
        .withSuccessHandler(setupResult)
        .withFailureHandler(() => setupResult(S.players))
        .updatePlayer(S.roomId, S.nick, myStateJSON(myRet), true);
      setTimeout(() => setupResult(S.players), 5000);
    } else setupResult(S.players);
  }

  // 결과화면 전용 하트비트 (대기실 hbTimer와 별개)
  function startResultHeartbeat() {
    stopResultHeartbeat();
    if (!(MP && MP.roomId)) return;
    heartbeat();
    MP.resultHbTimer = setInterval(heartbeat, 7000);
  }
  function stopResultHeartbeat() {
    if (MP && MP.resultHbTimer) {
      clearInterval(MP.resultHbTimer);
      MP.resultHbTimer = null;
    }
  }

  function paintMulti(myRet) {
    const list = renderRankMulti(true);
    const idx = list.findIndex((p) => p.nick === String(S.nick));
    const myRank = idx >= 0 ? idx + 1 : 1;
    document.getElementById("r-rank").textContent = myRank + "위";
    const rr = document.getElementById("r-return");
    rr.textContent = (myRet >= 0 ? "+" : "") + myRet.toFixed(2) + "%";
    rr.className = "result-return " + (myRet >= 0 ? "up" : "down");
    document.getElementById("r-equity").textContent =
      fmtNum(equity(S.me)) + "원";
    const brag =
      "StockBattle 멀티 🏆\n" +
      CAT_LABEL[S.category] +
      " · " +
      myRet.toFixed(2) +
      "% · " +
      myRank +
      "위/" +
      list.length +
      "명\n#StockBattle";
    const cp = document.getElementById("btn-copy");
    cp.dataset.txt = brag;
    cp.textContent = "결과 복사";
    cp.classList.remove("done");
    return myRank;
  }

  function triggerMultiAI(myRank, myRet) {
    const aiEl = document.getElementById("r-ai");
    const total = (S.players || []).length || 1;
    const summary = buildLogSummary(myRank, total, myRet);
    const payload = {
      nickname: S.nick,
      email: S.email || "",
      mode: "multi",
      symbolLabel: CAT_LABEL[S.category],
      leverage: S.startLev || S.me.leverage,
      durationMin: S.durationMin,
      finalReturn: myRet,
      rank: myRank,
      totalPlayers: total,
      summary: summary,
      gameId: S.gameId,
      chartData: JSON.stringify({ ret: S.equitySeries || [], log: S.log }),
    };
    // G: 거래내역 탭 채우기 + 결과 탭 초기화
    const rTrade = document.getElementById("r-trade");
    if (rTrade) rTrade.innerHTML = tradeTimelineHTML(S.log);
    const rtabs = document.getElementById("r-tabs");
    if (rtabs) {
      rtabs
        .querySelectorAll(".tab-btn")
        .forEach((b, i) => b.classList.toggle("active", i === 0));
      document
        .getElementById("screen-result")
        .querySelectorAll(".tab-panel")
        .forEach((p, i) => {
          p.style.display = i === 0 ? "" : "none";
          p.classList.toggle("active", i === 0);
        });
    }
    if (window.google && google.script && google.script.run) {
      aiEl.className = "ai-feedback loading";
      aiEl.textContent = "AI가 거래를 분석하는 중";
      google.script.run
        .withSuccessHandler((fb) => {
          renderAIFeedback(aiEl, fb, S.log.length);
        })
        .withFailureHandler(() => {
          aiEl.className = "ai-feedback";
          aiEl.textContent =
            "AI 분석 호출 실패. 거래 " + S.log.length + "건 기록됨.";
        })
        .finishGame(payload);
    } else {
      aiEl.className = "ai-feedback";
      aiEl.textContent = "(미리보기 모드) 거래 " + S.log.length + "건 기록됨.";
    }
  }

  // 초대 링크로 들어온 경우: 입장 화면 + 코드 자동 채움
  if (window.ROOM_PARAM) {
    document.getElementById("j-code").value = window.ROOM_PARAM;
    show("join");
  }

  // 테마 토글 + 시작 시 저장된 테마 적용
  (function () {
    function toggleTheme() {
      const dark =
        document.documentElement.getAttribute("data-theme") === "dark";
      applyTheme(dark ? "light" : "dark");
    }
    const sw = document.getElementById("theme-switch");
    if (sw) sw.onclick = toggleTheme;
    const sw2 = document.getElementById("lobby-theme-switch");
    if (sw2) sw2.onclick = toggleTheme;
    let saved = "light";
    try {
      saved = localStorage.getItem("sb-theme") || "light";
    } catch (e) {}
    applyTheme(saved);
  })();

  // 페이지 이탈 시 멀티 방에서 빠지기 (best-effort). 대기실·게임 중 모두 적용.
  window.addEventListener("pagehide", function () {
    try {
      if (MP && MP.roomId && navigator.sendBeacon) {
        // sendBeacon은 GAS로 직접 못 쏘니, google.script.run으로 best-effort 호출
      }
      if (
        MP &&
        MP.roomId &&
        window.google &&
        google.script &&
        google.script.run
      ) {
        google.script.run.leaveRoom(MP.roomId, MP.nick);
      }
    } catch (e) {}
  });

  // ---------- 유틸 ----------
  function show(name) {
    document
      .querySelectorAll(".screen")
      .forEach((s) => s.classList.remove("active"));
    document.getElementById("screen-" + name).classList.add("active");
    document.body.classList.toggle("in-game", name === "game");
    if (name !== "game") window.scrollTo(0, 0);
  }
  function fmtTime(s) {
    s = Math.max(0, s);
    return (
      String(Math.floor(s / 60)).padStart(2, "0") +
      ":" +
      String(s % 60).padStart(2, "0")
    );
  }
  function fmtNum(n) {
    return Math.round(n).toLocaleString("ko-KR");
  }
</script>
