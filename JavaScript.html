<script>
  /* ===================================================================
   * StockBattle 엔진 — 1단계
   *  · 종목 인게임 선택(한 종목만 보유, 올인) · 워치리스트 + 차트 2개
   *  · 시드 기반 결정론 시뮬(멀티 대비) · 종목별 뉴스 아크(급등→되돌림)
   *  · 거래 로그(AI 피드백용) · 닉네임 필수 · 레버리지 쿨다운(틱 기반)
   *  뉴스 문구는 로컬 풀(=AI 자리). 2단계에서 Gemini로 교체.
   * =================================================================== */

  const START_MONEY = 1000000;
  const TICK_MS = 1500;
  const VOL = 0.012;
  const LEV_STEPS = [1, 2, 5, 10, 20]; // 설정은 10까지, 게임 중 10→20 가능
  const COOLDOWN_TICKS = Math.round(25000 / TICK_MS); // ≈17틱(25초)
  const EVENT_TICKS = 12; // 뉴스 아크 길이
  const EVENT_DRIFT = 0.022; // 아크 드리프트 세기
  const COUNTDOWN_MS = 2800; // 카운트다운(3·2·1·START, 700ms×4)
  function nowSync() {
    return Date.now() + ((typeof S !== "undefined" && S && S.clockOffset) || 0);
  } // 기기 시계 보정된 현재시각

  // ---------- 사운드 (Web Audio, 파일 없이 합성음) ----------
  let AC = null,
    SFX_ON = true;
  function sfx(type) {
    if (!SFX_ON) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const t0 = AC.currentTime;
      const beep = (freq, start, dur, wave, gain) => {
        const o = AC.createOscillator(),
          g = AC.createGain();
        o.type = wave || "triangle";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + start);
        g.gain.exponentialRampToValueAtTime(gain || 0.12, t0 + start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        o.connect(g);
        g.connect(AC.destination);
        o.start(t0 + start);
        o.stop(t0 + start + dur + 0.03);
      };
      if (type === "buy") {
        beep(523, 0, 0.12);
        beep(784, 0.07, 0.13);
      } else if (type === "sell") {
        beep(659, 0, 0.11);
        beep(440, 0.08, 0.15);
      } else if (type === "lev") {
        beep(880, 0, 0.07, "square", 0.07);
        beep(1175, 0.07, 0.1, "square", 0.07);
      } else if (type === "news") {
        beep(988, 0, 0.16, "sine", 0.09);
      } else if (type === "liq") {
        beep(180, 0, 0.45, "sawtooth", 0.16);
        beep(110, 0.13, 0.5, "sawtooth", 0.16);
      } else if (type === "count") {
        beep(660, 0, 0.09, "sine", 0.1);
      } else if (type === "go") {
        beep(523, 0, 0.1);
        beep(659, 0.1, 0.1);
        beep(1047, 0.2, 0.26);
      } else if (type === "win") {
        beep(523, 0, 0.12);
        beep(659, 0.12, 0.12);
        beep(784, 0.24, 0.12);
        beep(1047, 0.36, 0.3);
      }
    } catch (e) {}
  }
  document.getElementById("g-mute").onclick = function () {
    SFX_ON = !SFX_ON;
    this.textContent = SFX_ON ? "🔊" : "🔇";
    if (SFX_ON) sfx("count");
  };

  const INSTR = {
    kr: [
      ["000660.KS", "SK하이닉스"],
      ["005930.KS", "삼성전자"],
      ["035720.KS", "카카오"],
      ["035420.KS", "네이버"],
    ],
    us: [
      ["AAPL", "애플"],
      ["TSLA", "테슬라"],
      ["NVDA", "엔비디아"],
      ["MSFT", "마이크로소프트"],
    ],
    coin: [
      ["bitcoin", "비트코인"],
      ["ethereum", "이더리움"],
      ["solana", "솔라나"],
      ["ripple", "리플"],
    ],
  };
  const CAT_LABEL = { kr: "국내주", us: "해외주", coin: "코인" };
  const POS_NEWS = [
    "깜짝 실적에 매수세 폭발 🚀",
    "대형 호재 공시 📈",
    "글로벌 기관 대량 매수 🔥",
    "신제품 흥행 기대감 ✨",
  ];
  const NEG_NEWS = [
    "예상 밖 악재로 투매 📉",
    "규제 리스크 부각 ⚠️",
    "대량 매도 물량 출회 🐻",
    "실적 쇼크 우려 ❄️",
  ];

  let S = {};
  let rng = Math.random;
  let charts = [null, null];

  const FALLBACK = {
    "000660.KS": 235000,
    "005930.KS": 78000,
    "035720.KS": 42000,
    "035420.KS": 180000,
    AAPL: 230,
    TSLA: 350,
    NVDA: 140,
    MSFT: 430,
    bitcoin: 95000000,
    ethereum: 4800000,
    solana: 320000,
    ripple: 3500,
  };

  // ---------- 시드 PRNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss() {
    let u = 0,
      v = 0;
    while (!u) u = rng();
    while (!v) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------- 설정 화면 ----------
  const setup = { category: "kr", leverage: 1, durationMin: 3 };
  function renderMarketHint() {
    document.getElementById("market-hint").textContent =
      "종목: " + INSTR[setup.category].map((x) => x[1]).join(" · ");
  }
  function bindSeg(id, attr, key, target, after) {
    document.getElementById(id).addEventListener("click", (e) => {
      const btn = e.target.closest(".seg-btn");
      if (!btn) return;
      e.currentTarget
        .querySelectorAll(".seg-btn")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      target[key] = isNaN(+btn.dataset[attr])
        ? btn.dataset[attr]
        : +btn.dataset[attr];
      if (after) after();
    });
  }
  bindSeg("seg-category", "cat", "category", setup, renderMarketHint);
  bindSeg("seg-leverage", "lev", "leverage", setup);
  bindSeg("seg-duration", "min", "durationMin", setup);
  renderMarketHint();

  document.getElementById("btn-start").onclick = () => {
    const input = document.getElementById("in-nickname");
    const nick = input.value.trim();
    const err = document.getElementById("nick-err");
    if (!nick) {
      input.classList.add("invalid");
      err.textContent = "닉네임을 입력해주세요";
      input.focus();
      return;
    }
    input.classList.remove("invalid");
    err.textContent = "";
    const email = document.getElementById("in-email").value.trim();
    const items = INSTR[setup.category].map(([symbol, label]) => ({
      category: setup.category,
      symbol,
      label,
    }));

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((prices) =>
          startGame(nick, email, items, prices, "live"),
        )
        .withFailureHandler(() =>
          startGame(nick, email, items, null, "fallback"),
        )
        .getSeedPrices(
          items.map((i) => ({ category: i.category, symbol: i.symbol })),
        );
    } else {
      startGame(nick, email, items, null, "sim");
    }
  };

  // ---------- 게임 시작 ----------
  function startGame(nick, email, items, prices, source) {
    const seed = (Math.random() * 0x7fffffff) | 0;
    rng = mulberry32(seed);
    const priceMap = {};
    if (prices) prices.forEach((p) => (priceMap[p.symbol] = p.price));

    const instruments = items.map((it) => {
      const p = priceMap[it.symbol] || FALLBACK[it.symbol] || 100000;
      return {
        symbol: it.symbol,
        label: it.label,
        price: p,
        start: p,
        prev: p,
        hist: [p],
        event: null,
      };
    });

    S = {
      nick,
      email,
      seed,
      source,
      mode: "single",
      roomNews: null,
      category: setup.category,
      durationMin: setup.durationMin,
      durationSec: setup.durationMin * 60,
      totalTicks: Math.round((setup.durationMin * 60) / (TICK_MS / 1000)),
      elapsed: 0,
      tick: 0,
      instruments,
      me: newTrader(nick, "human", setup.leverage),
      bots: [
        newTrader("공격투자봇", "aggro", 2),
        newTrader("존버개미", "hodl", 1),
      ],
      featured: [0, 1],
      log: [],
      news: [],
    };
    S.news = genNewsSchedule();

    document.getElementById("g-source").textContent = source;
    document.getElementById("g-brief").textContent =
      "📊 변동성이 큰 장세입니다. 속보가 뜨는 종목을 노려 단타하세요!";
    fetchAINews();
    show("game");
    initCharts();
    updateCharts();
    updateUI();
    runCountdown(() => {
      S.timer = setInterval(onSecond, 1000);
      S.priceTimer = setInterval(onTick, TICK_MS);
    });
  }

  function newTrader(name, strategy, lev) {
    return {
      name,
      strategy,
      cash: START_MONEY,
      posIdx: -1,
      entryPrice: 0,
      entryCapital: 0,
      leverage: lev || 1,
      liquidated: false,
      levCdTick: 0,
    };
  }
  function instPrice(idx) {
    return S.instruments[idx].price;
  }
  function equity(t) {
    if (t.liquidated) return 0;
    if (t.posIdx < 0) return t.cash;
    return Math.max(
      0,
      t.entryCapital *
        (1 + t.leverage * (instPrice(t.posIdx) / t.entryPrice - 1)),
    );
  }
  function ret(t) {
    return (equity(t) / START_MONEY - 1) * 100;
  }

  // ---------- 뉴스 일정 (시드 결정론) ----------
  function genNewsSchedule() {
    const total = S.totalTicks,
      n = 4 + Math.floor(rng() * 3),
      out = [];
    for (let k = 0; k < n; k++) {
      const at = Math.floor(rng() * total * 0.85) + Math.floor(total * 0.06);
      const idx = Math.floor(rng() * S.instruments.length);
      const dir = rng() < 0.5 ? 1 : -1;
      const label = S.instruments[idx].label;
      let head;
      const tmpl = S.roomNews && S.roomNews[label];
      if (tmpl) {
        head =
          (dir > 0 ? tmpl.pos : tmpl.neg) ||
          label +
            " " +
            (dir > 0 ? POS_NEWS : NEG_NEWS)[
              Math.floor(rng() * POS_NEWS.length)
            ];
      } else {
        const pool = dir > 0 ? POS_NEWS : NEG_NEWS;
        head = label + " " + pool[Math.floor(rng() * pool.length)];
      }
      out.push({ at, idx, dir, head, fired: false });
    }
    return out.sort((a, b) => a.at - b.at);
  }

  // 시작 시 AI 시황/뉴스 (성공하면 로컬 헤드라인을 AI 것으로 교체, 실패하면 그대로)
  function fetchAINews() {
    if (!(window.google && google.script && google.script.run)) return;
    const items = S.news.map((ev) => ({
      label: S.instruments[ev.idx].label,
      dir: ev.dir,
    }));
    google.script.run
      .withSuccessHandler((res) => {
        if (!res) return;
        if (res.brief)
          document.getElementById("g-brief").textContent = "📊 " + res.brief;
        if (res.heads)
          S.news.forEach((ev, i) => {
            if (res.heads[i] && !ev.fired) ev.head = res.heads[i];
          });
      })
      .withFailureHandler(() => {})
      .aiMarketNews(S.category, items);
  }

  // ---------- 카운트다운 ----------
  function runCountdown(cb) {
    const seq = ["3", "2", "1", "START"];
    const ov = document.getElementById("countdown");
    const el = document.getElementById("cd-num");
    let i = 0;
    ov.classList.add("show");
    (function step() {
      if (i >= seq.length) {
        ov.classList.remove("show");
        cb();
        return;
      }
      el.textContent = seq[i];
      el.classList.toggle("start", seq[i] === "START");
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
      sfx(seq[i] === "START" ? "go" : "count");
      i++;
      setTimeout(step, 700);
    })();
  }

  // ---------- 타이머 / 틱 ----------
  function onSecond() {
    S.elapsed++;
    const left =
      S.mode === "multi" && S.endAt
        ? Math.round((S.endAt - nowSync()) / 1000)
        : S.durationSec - S.elapsed;
    const el = document.getElementById("g-timer");
    el.textContent = fmtTime(Math.max(0, left));
    el.classList.toggle("urgent", left <= 10);
    updateLevButton();
    if (left <= 0) endGame();
  }
  function onTick() {
    S.tick++;
    S.news.forEach((ev) => {
      if (!ev.fired && S.tick >= ev.at) {
        ev.fired = true;
        S.instruments[ev.idx].event = {
          left: EVENT_TICKS,
          total: EVENT_TICKS,
          dir: ev.dir,
        };
        showNews("📰 " + ev.head);
        sfx("news");
      }
    });
    S.instruments.forEach((inst) => {
      inst.prev = inst.price;
      let vol = VOL,
        drift = 0;
      if (inst.event) {
        const phase = 1 - inst.event.left / inst.event.total; // 0→1
        drift =
          phase < 0.4
            ? inst.event.dir * EVENT_DRIFT
            : -inst.event.dir * EVENT_DRIFT * 0.65; // 급등 후 되돌림
        vol = VOL * 1.4;
        inst.event.left--;
        if (inst.event.left <= 0) inst.event = null;
      }
      inst.price = Math.max(0.0001, inst.price * (1 + gauss() * vol + drift));
      inst.hist.push(inst.price);
      if (inst.hist.length > 120) inst.hist.shift();
    });
    [S.me, ...S.bots].forEach((t) => {
      if (t.posIdx >= 0 && !t.liquidated && equity(t) <= 0) {
        if (t === S.me)
          logEvt(
            "liq",
            S.instruments[t.posIdx].label,
            instPrice(t.posIdx),
            t.leverage,
            null,
          );
        t.liquidated = true;
        t.posIdx = -1;
        if (t === S.me) liquidationFX();
      }
    });
    if (S.mode === "multi") maybeSyncMulti();
    else botThink();
    updateCharts();
    updateUI();
  }

  // ---------- 매매 / 레버리지 ----------
  function enter(t, idx) {
    t.posIdx = idx;
    t.entryPrice = instPrice(idx);
    t.entryCapital = t.cash;
    if (t.strategy === "human")
      logEvt("buy", S.instruments[idx].label, t.entryPrice, t.leverage, null);
  }
  function sell(t) {
    if (t.posIdx < 0) return false;
    const idx = t.posIdx,
      eq = equity(t),
      pnl = eq - t.entryCapital;
    t.cash = eq;
    t.posIdx = -1;
    t.entryPrice = 0;
    t.entryCapital = 0;
    if (t.strategy === "human")
      logEvt("sell", S.instruments[idx].label, instPrice(idx), t.leverage, pnl);
    return true;
  }
  function buy(t, idx) {
    if (t.liquidated || t.posIdx === idx) return;
    if (t.posIdx >= 0) sell(t);
    enter(t, idx);
  }
  function bumpLev(t) {
    const i = LEV_STEPS.indexOf(t.leverage);
    if (i >= LEV_STEPS.length - 1) return false;
    if (S.tick < t.levCdTick) return false;
    if (t.posIdx >= 0) {
      const eq = equity(t);
      t.entryCapital = eq;
      t.entryPrice = instPrice(t.posIdx);
    } // 현재가로 재기준
    t.leverage = LEV_STEPS[i + 1];
    t.levCdTick = S.tick + COOLDOWN_TICKS;
    if (t.strategy === "human")
      logEvt(
        "levup",
        t.posIdx >= 0 ? S.instruments[t.posIdx].label : "-",
        t.posIdx >= 0 ? instPrice(t.posIdx) : 0,
        t.leverage,
        null,
      );
    return true;
  }
  function logEvt(type, label, price, lev, pnl) {
    S.log.push({
      sec: S.elapsed,
      type,
      label,
      price: Math.round(price),
      lev,
      pnl: pnl == null ? null : Math.round(pnl),
    });
  }

  // 플레이어 입력
  document.getElementById("cA-buy").onclick = () => {
    buy(S.me, S.featured[0]);
    sfx("buy");
    flash("cA-price");
    updateUI();
  };
  document.getElementById("cB-buy").onclick = () => {
    buy(S.me, S.featured[1]);
    sfx("buy");
    flash("cB-price");
    updateUI();
  };
  document.getElementById("btn-sell").onclick = () => {
    if (sell(S.me)) {
      sfx("sell");
      updateUI();
    }
  };
  document.getElementById("btn-levup").onclick = () => {
    if (bumpLev(S.me)) {
      sfx("lev");
      flash("cA-price");
      flash("cB-price");
    }
    updateUI();
  };

  // ---------- AI 봇 (시드 결정론) ----------
  function randInst() {
    return Math.floor(rng() * S.instruments.length);
  }
  function botThink() {
    S.bots.forEach((b) => {
      if (b.liquidated) return;
      if (b.strategy === "aggro") {
        if (b.posIdx < 0) {
          if (rng() < 0.3) buy(b, randInst());
        } else {
          if (rng() < 0.25) sell(b);
          else if (rng() < 0.2) buy(b, randInst());
          else if (rng() < 0.3) bumpLev(b);
        }
      } else {
        if (b.posIdx < 0) {
          if (rng() < 0.12) buy(b, randInst());
        } else {
          if (rng() < 0.04) sell(b);
          else if (rng() < 0.04) bumpLev(b);
        }
      }
    });
  }

  // ---------- 워치리스트 ----------
  function feature(idx) {
    if (S.featured[0] === idx) return;
    S.featured = [idx, S.featured[0]];
    bindChartInstruments();
    updateCharts();
    updateUI();
  }
  function renderWatch() {
    const box = document.getElementById("g-watch");
    box.innerHTML = "";
    S.instruments.forEach((inst, idx) => {
      const chg = (inst.price / inst.start - 1) * 100;
      const held = S.me.posIdx === idx;
      const feat = S.featured.includes(idx);
      const d = document.createElement("div");
      d.className =
        "watch-item" + (held ? " held" : "") + (feat ? " featured" : "");
      d.onclick = () => feature(idx);
      d.innerHTML = `<span class="watch-name">${inst.label}${held ? ' <span class="watch-held-dot">●보유</span>' : ""}</span>
      <span class="watch-chg ${chg >= 0 ? "up" : "down"}">${(chg >= 0 ? "+" : "") + chg.toFixed(2)}%</span>`;
      box.appendChild(d);
    });
  }

  // ---------- 차트 ----------
  const liqLinePlugin = {
    id: "liqLine",
    afterDraw(c) {
      if (!S.me || S.me.posIdx < 0 || S.me.liquidated || c._idx !== S.me.posIdx)
        return;
      const L = S.me.leverage;
      if (L <= 1) return;
      const liq = S.me.entryPrice * (1 - 1 / L);
      const y = c.scales.y;
      if (liq < y.min || liq > y.max) return;
      const py = y.getPixelForValue(liq),
        a = c.chartArea,
        ctx = c.ctx;
      ctx.save();
      ctx.strokeStyle = "#f04452";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(a.left, py);
      ctx.lineTo(a.right, py);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#f04452";
      ctx.font = "bold 10px Pretendard";
      ctx.fillText("청산선 " + fmtNum(liq), a.left + 4, py - 4);
      ctx.restore();
    },
  };
  function makeChart(canvasId) {
    var ex = Chart.getChart(canvasId);
    if (ex) ex.destroy(); // 캔버스 재사용 에러 방지
    return new Chart(document.getElementById(canvasId), {
      type: "line",
      data: {
        labels: [],
        datasets: [
          {
            data: [],
            borderColor: "#3182f6",
            borderWidth: 2,
            fill: true,
            backgroundColor: "rgba(49,130,246,.08)",
            tension: 0.3,
            pointRadius: 0,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { display: false },
          y: {
            display: true,
            ticks: { color: "#8b95a1", font: { size: 9 } },
            grid: { color: "#f2f4f6" },
          },
        },
      },
      plugins: [liqLinePlugin],
    });
  }
  function initCharts() {
    charts[0] = makeChart("chartA");
    charts[1] = makeChart("chartB");
    bindChartInstruments();
  }
  window.addEventListener("resize", function () {
    charts.forEach(function (c) {
      if (c) c.resize();
    });
  });
  function bindChartInstruments() {
    charts[0]._idx = S.featured[0];
    charts[1]._idx = S.featured[1];
  }
  function updateCharts() {
    charts.forEach((c, k) => {
      if (!c) return;
      const inst = S.instruments[S.featured[k]];
      const up = inst.price >= inst.start;
      c._idx = S.featured[k];
      c.data.labels = inst.hist.map((_, i) => i);
      c.data.datasets[0].data = inst.hist;
      c.data.datasets[0].borderColor = up ? "#f04452" : "#3182f6";
      c.data.datasets[0].backgroundColor = up
        ? "rgba(240,68,82,.08)"
        : "rgba(49,130,246,.08)";
      c.update("none");
    });
    updateChartHeads();
  }
  function updateChartHeads() {
    [
      ["cA", 0],
      ["cB", 1],
    ].forEach(([pre, k]) => {
      const idx = S.featured[k],
        inst = S.instruments[idx];
      const chg = (inst.price / inst.start - 1) * 100;
      document.getElementById(pre + "-name").textContent = inst.label;
      const pe = document.getElementById(pre + "-price");
      pe.textContent =
        fmtNum(inst.price) +
        " (" +
        (chg >= 0 ? "+" : "") +
        chg.toFixed(2) +
        "%)";
      pe.classList.remove("up", "down");
      pe.classList.add(chg >= 0 ? "up" : "down");
      const btn = document.getElementById(pre + "-buy");
      if (S.me.liquidated) {
        btn.disabled = true;
        btn.textContent = "청산됨";
      } else if (S.me.posIdx === idx) {
        btn.disabled = true;
        btn.textContent = "보유 중";
      } else {
        btn.disabled = false;
        btn.textContent = "매수";
      }
    });
  }

      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {

      } catch (e) {}
      document.body.removeChild(ta);

    this.textContent = ok ? "복사됨 ✓" : "복사 실패 (텍스트 길게 눌러 복사)";

  // AI 피드백용 거래 요약 (기록 그대로, 지어내기 방지)
  function buildLogSummary(rank, total, myRet) {
    const lines = S.log
      .map((e) => {
        const t = fmtTime(e.sec);
        if (e.type === "buy")
          return `[${t}] 매수 ${e.label} @${e.price} (${e.lev}배)`;
        if (e.type === "sell")
          return `[${t}] 매도 ${e.label} @${e.price} 손익 ${e.pnl >= 0 ? "+" : ""}${e.pnl}`;
        if (e.type === "levup") return `[${t}] 레버리지 ${e.lev}배로 상향`;
        if (e.type === "liq") return `[${t}] 청산 ${e.label} @${e.price}`;
        return "";
      })
      .filter(Boolean);
    const news = S.news
      .filter((n) => n.fired)
      .map(
        (n) => `[${fmtTime(Math.round((n.at * TICK_MS) / 1000))}] ${n.head}`,
      );
    return (
      "시장:" +
      CAT_LABEL[S.category] +
      " / 게임시간:" +
      S.durationMin +
      "분 / 시작레버리지:" +
      (S.startLev != null ? S.startLev : setup.leverage) +
      "배\n" +
      "뉴스:\n" +
      (news.join("\n") || "없음") +
      "\n" +
      "거래내역:\n" +
      (lines.join("\n") || "거래 없음") +
      "\n" +
      "최종결과: 수익률 " +
      myRet.toFixed(2) +
      "% / " +
      total +
      "명 중 " +
      rank +
      "위"
    );
  }

  function onLobby(d) {
    if (!d || d.error) return;
    MP.room = d;
    const ul = document.getElementById("l-players");
    ul.innerHTML = "";
    const seen = {};
    const plist = (d.players || []).filter((p) => {
      const k = String(p.nick);
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    });
    plist.forEach((p, i) => {
      const li = document.createElement("li");
      li.className =
        "rank-row" + (String(p.nick) === String(MP.nick) ? " me" : "");
      li.innerHTML = `<span class="rank-no">${i + 1}</span><span class="rank-name">${p.nick}${String(p.nick) === String(d.host) ? " 👑" : ""}</span>`;
      ul.appendChild(li);

    document.getElementById("l-count").textContent = "(" + plist.length + "명)";
    document.getElementById("l-info").textContent =

  document.getElementById("l-copy").onclick = async function () {
    const url = MP.inviteUrl || "";
    const text = "StockBattle 주식 대결에 초대합니다! 방 코드 " + MP.roomId;
    // 1) 휴대폰/지원 브라우저: OS 공유 시트(카톡·인스타·메시지 등)
    if (navigator.share) {
      try {
        await navigator.share({
          title: "StockBattle 초대",
          text: text,
          url: url || undefined,
        });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      } // 사용자가 닫음
    }
    // 2) 폴백: 초대 링크 클립보드 복사 → 카톡 등에 붙여넣기
    const copyText = url || text;
    let ok = false;
    try {
      await navigator.clipboard.writeText(copyText);
      ok = true;
    } catch (e) {}
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        ok = document.execCommand("copy");
      } catch (e) {}
      document.body.removeChild(ta);
    }
    this.textContent = ok
      ? "링크 복사됨 ✓ 붙여넣어 공유하세요"
      : "복사 실패 (아래 링크를 길게 눌러 복사)";
  };

  // 멀티 게임 시작 (시드 공유 → 가격/뉴스 전원 동일, 시작가는 결정론적 FALLBACK 사용)
  function startMultiGame(d) {
    rng = mulberry32(d.seed);
    const items = INSTR[d.category].map(([symbol, label]) => ({
      symbol,
      label,
    }));
    const instruments = items.map((it) => {
      const p = FALLBACK[it.symbol] || 100000;
      return {
        symbol: it.symbol,
        label: it.label,
        price: p,
        start: p,
        prev: p,
        hist: [p],
        event: null,
      };
    });
    S = {
      nick: MP.nick,
      email: "",
      seed: d.seed,
      source: "멀티",
      mode: "multi",
      roomId: MP.roomId,
      category: d.category,
      durationMin: d.durationMin,
      durationSec: d.durationMin * 60,
      totalTicks: Math.round((d.durationMin * 60) / (TICK_MS / 1000)),
      elapsed: 0,
      tick: 0,
      instruments,
      me: newTrader(MP.nick, "human", d.leverage),
      bots: [],
      featured: [0, 1],
      log: [],
      news: [],
      roomNews: d.news || {},
      players: d.players || [],
      syncEvery: 2,
      startLev: d.leverage,
    };
    S.news = genNewsSchedule();
    S.clockOffset = d.serverNow ? d.serverNow - Date.now() : 0; // 기기 시계 차이 보정
    S.endAt = d.startTime + COUNTDOWN_MS + S.durationSec * 1000; // 전원 동일한 절대 종료시각
    document.getElementById("g-source").textContent = "멀티";
    document.getElementById("g-brief").textContent =
      "📊 친구들과 실시간 대결! 같은 시장·같은 뉴스로 승부.";
    show("game");
    initCharts();
    updateCharts();
    updateUI();
    const delay = Math.max(0, d.startTime - nowSync());
    setTimeout(() => {
      runCountdown(() => {
        S.timer = setInterval(onSecond, 1000);
        S.priceTimer = setInterval(onTick, TICK_MS);
      });
    }, delay);
  }

  // 내 수익률 주기적 업로드 + 전체 순위 수신
  function maybeSyncMulti() {
    if (S.tick % S.syncEvery !== 0) return;
    if (!(window.google && google.script && google.script.run)) return;
    google.script.run
      .withSuccessHandler((ps) => {
        if (ps && !S.ended) S.players = ps;
      }) // 종료 후 도착분은 무시(스테일 방지)
      .withFailureHandler(() => {})
      .updatePlayer(S.roomId, S.nick, +ret(S.me).toFixed(2), false);
  }

  // 멀티 순위 (닉 기준 dedup으로 서버 중복·타입 이슈 방어, 내 값은 로컬 최신)
  function renderRankMulti(reveal) {
    const byNick = {};
    (S.players || []).forEach((p) => {
      byNick[String(p.nick)] = {
        nick: String(p.nick),
        ret: Number(p.ret) || 0,
      };
    });
    const meKey = String(S.nick);
    byNick[meKey] = { nick: meKey, ret: ret(S.me) }; // 나는 항상 1개, 로컬 최신값
    const list = Object.keys(byNick)
      .map((k) => byNick[k])
      .sort((a, b) => b.ret - a.ret);
    const ul = document.getElementById(reveal ? "r-rank-list" : "g-rank");
    ul.innerHTML = "";
    list.forEach((p, i) => {
      const me = p.nick === meKey,
        r = p.ret;
      const li = document.createElement("li");
      li.className = "rank-row" + (me ? " me" : "");
      li.innerHTML = `<span class="rank-no">${i + 1}</span>
      <span class="rank-name">${p.nick}</span>
      <span class="rank-val ${r >= 0 ? "up" : "down"}" ${reveal ? "" : 'style="display:none"'}>${(r >= 0 ? "+" : "") + r.toFixed(2)}%</span>`;
      ul.appendChild(li);
    });
    return list;
  }

  function endGameMulti() {
    S.ended = true; // 종료 후 중간 동기화가 데이터 못 덮게
    const myRet = ret(S.me);
    const setupResult = (ps) => {
      if (ps) S.players = ps;
      const myRank = paintMulti(myRet); // 순위 + 등수/수익 표시
      sfx(myRank === 1 ? "win" : "sell");
      triggerMultiAI(myRank, myRet); // 저장 + AI
      document.getElementById("r-email-note").textContent =
        "친구와의 실시간 대결 결과입니다.";
      show("result");
      // 늦게 끝난 사람 최종값까지 수렴 (최대 ~15초, 매번 재렌더)
      let tries = 0;
      const poll = () => {
        tries++;
        google.script.run
          .withSuccessHandler((p2) => {
            if (p2) S.players = p2;
            paintMulti(myRet);
            const all =
              (S.players || []).length && S.players.every((x) => x.finished);
            if (!(all && tries >= 2) && tries < 10) setTimeout(poll, 1500); // 전원 종료+2회 이상 폴링해야 멈춤
          })
          .withFailureHandler(() => {
            if (tries < 10) setTimeout(poll, 1500);
          })
          .getRoomPlayers(S.roomId);
      };
      setTimeout(poll, 1500);
    };
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(setupResult)
        .withFailureHandler(() => setupResult(S.players))
        .updatePlayer(S.roomId, S.nick, +myRet.toFixed(2), true);
    } else setupResult(S.players);
  }

  function paintMulti(myRet) {
    const list = renderRankMulti(true);
    const idx = list.findIndex((p) => p.nick === String(S.nick));
    const myRank = idx >= 0 ? idx + 1 : 1;
    document.getElementById("r-rank").textContent = myRank + "위";
    const rr = document.getElementById("r-return");
    rr.textContent = (myRet >= 0 ? "+" : "") + myRet.toFixed(2) + "%";
    rr.className = "result-return " + (myRet >= 0 ? "up" : "down");
    document.getElementById("r-equity").textContent =
      fmtNum(equity(S.me)) + "원";
    const brag =
      "StockBattle 멀티 🏆\n" +
      CAT_LABEL[S.category] +
      " · " +
      myRet.toFixed(2) +
      "% · " +
      myRank +
      "위/" +
      list.length +
      "명\n#StockBattle";
    const cp = document.getElementById("btn-copy");
    cp.dataset.txt = brag;
    cp.textContent = "결과 복사";
    cp.classList.remove("done");
    return myRank;
  }

  function triggerMultiAI(myRank, myRet) {
    const aiEl = document.getElementById("r-ai");
    const total = (S.players || []).length || 1;
    const summary = buildLogSummary(myRank, total, myRet);
    const payload = {
      nickname: S.nick,
      email: "",
      mode: "multi",
      symbolLabel: CAT_LABEL[S.category],
      leverage: S.startLev || S.me.leverage,
      durationMin: S.durationMin,
      finalReturn: myRet,
      rank: myRank,
      totalPlayers: total,
      summary: summary,
    };
    if (window.google && google.script && google.script.run) {
      aiEl.textContent = "🤖 AI가 거래를 분석하는 중...";
      google.script.run
        .withSuccessHandler((fb) => {
          aiEl.textContent = fb
            ? fb
            : "AI 분석을 불러오지 못했어요 (API 키/쿼터 확인). 거래 " +
              S.log.length +
              "건 기록됨.";
        })
        .withFailureHandler(() => {
          aiEl.textContent =
            "AI 분석 호출 실패. 거래 " + S.log.length + "건 기록됨.";
        })
        .finishGame(payload); // 저장(히스토리) + AI 피드백
    } else {
      aiEl.textContent = "(미리보기 모드) 거래 " + S.log.length + "건 기록됨.";
    }
  }

  // 초대 링크로 들어온 경우: 입장 화면 + 코드 자동 채움
  if (window.ROOM_PARAM) {
    document.getElementById("j-code").value = window.ROOM_PARAM;
    show("join");
  }

  // ---------- 유틸 ----------
  function show(name) {
    document
      .querySelectorAll(".screen")
      .forEach((s) => s.classList.remove("active"));
    document.getElementById("screen-" + name).classList.add("active");
    window.scrollTo(0, 0);
  }
  function fmtTime(s) {
    s = Math.max(0, s);
    return (
      String(Math.floor(s / 60)).padStart(2, "0") +
      ":" +
      String(s % 60).padStart(2, "0")
    );
  }
  function fmtNum(n) {
    return Math.round(n).toLocaleString("ko-KR");
  }
</script>
